name: Build CFM Phone Farm LAN APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'__CFM_FARM_SOURCE_00_EOF__'
          plugins { id 'com.android.application' }
          android {
              namespace 'id.cfm.phonefarm'
              compileSdk 34
              defaultConfig {
                  applicationId 'id.cfm.phonefarm'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          __CFM_FARM_SOURCE_00_EOF__
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'__CFM_FARM_SOURCE_01_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application android:label="CFM Phone Farm LAN" android:theme="@android:style/Theme.Material.NoActionBar" android:usesCleartextTraffic="true" android:allowBackup="false" android:icon="@drawable/ic_app">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".FarmService" android:exported="false" android:foregroundServiceType="mediaProjection" />
                  <service android:name=".RemoteAccessibilityService" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/remote_accessibility" />
                  </service>
              </application>
          </manifest>
          __CFM_FARM_SOURCE_01_EOF__
          mkdir -p 'app/src/main/java/id/cfm/phonefarm'
          cat > 'app/src/main/java/id/cfm/phonefarm/FarmService.java' <<'__CFM_FARM_SOURCE_02_EOF__'
          package id.cfm.phonefarm;
          
          import android.app.*;
          import android.content.*;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.*;
          import android.util.DisplayMetrics;
          import android.view.WindowManager;
          
          import org.json.JSONObject;
          
          import java.io.*;
          import java.net.*;
          import java.nio.ByteBuffer;
          import java.nio.charset.StandardCharsets;
          import java.security.MessageDigest;
          import java.util.*;
          import java.util.concurrent.*;
          
          /** Companion server: LAN-only authenticated snapshots + explicitly permitted gestures. */
          public class FarmService extends Service {
              public static final int PORT = 8765;
              public static final String ACTION_START = "id.cfm.phonefarm.START";
              public static final String ACTION_STOP = "id.cfm.phonefarm.STOP";
              public static final String EXTRA_CODE = "resultCode";
              public static final String EXTRA_DATA = "resultData";
              public static volatile boolean running = false;
          
              private volatile byte[] lastFrame;
              private volatile long lastFrameAt;
              private ServerSocket socket;
              private Thread acceptThread;
              private final ExecutorService clients = Executors.newFixedThreadPool(4);
              private MediaProjection projection;
              private VirtualDisplay display;
              private ImageReader reader;
              private HandlerThread captureThread;
              private int physicalW = 0, physicalH = 0;
              private final Handler main = new Handler(Looper.getMainLooper());
          
              @Override public IBinder onBind(Intent intent) { return null; }
          
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null) return START_NOT_STICKY;
                  if (ACTION_STOP.equals(intent.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (!ACTION_START.equals(intent.getAction())) return START_NOT_STICKY;
                  showNotification();
                  if (running) return START_NOT_STICKY;
                  try {
                      int code = intent.getIntExtra(EXTRA_CODE, Activity.RESULT_CANCELED);
                      Intent data;
                      if (Build.VERSION.SDK_INT >= 33) data = intent.getParcelableExtra(EXTRA_DATA, Intent.class);
                      else data = intent.getParcelableExtra(EXTRA_DATA);
                      if (code != Activity.RESULT_OK || data == null) throw new IllegalStateException("Izin layar tidak ada");
                      startProjection(code, data);
                      startServer();
                      running = true;
                  } catch (Exception e) {
                      android.util.Log.e("PhoneFarm", "Gagal memulai farm service", e);
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }
          
              private void showNotification() {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("farm_active", "Berbagi layar Phone Farm", NotificationManager.IMPORTANCE_LOW);
                      ch.setDescription("Notifikasi saat HP bisa dilihat dan dikontrol di jaringan lokal");
                      nm.createNotificationChannel(ch);
                  }
                  Intent open = new Intent(this, MainActivity.class);
                  PendingIntent openPI = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Intent stop = new Intent(this, FarmService.class).setAction(ACTION_STOP);
                  PendingIntent stopPI = PendingIntent.getService(this, 1, stop, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(this, "farm_active")
                          .setSmallIcon(android.R.drawable.presence_video_online)
                          .setContentTitle("Phone Farm LAN aktif")
                          .setContentText("Layar dibagikan ke pengontrol di hotspot yang sama")
                          .setContentIntent(openPI)
                          .setOngoing(true)
                          .addAction(new Notification.Action.Builder(android.R.drawable.ic_menu_close_clear_cancel, "Hentikan", stopPI).build())
                          .build();
                  if (Build.VERSION.SDK_INT >= 29) startForeground(43, n, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  else startForeground(43, n);
              }
          
              private void startProjection(int resultCode, Intent resultData) {
                  MediaProjectionManager mgr = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                  projection = mgr.getMediaProjection(resultCode, resultData);
                  if (projection == null) throw new IllegalStateException("MediaProjection kosong");
                  projection.registerCallback(new MediaProjection.Callback() {
                      @Override public void onStop() { main.post(() -> stopSelf()); }
                  }, main);
          
                  DisplayMetrics dm = new DisplayMetrics();
                  ((WindowManager) getSystemService(WINDOW_SERVICE)).getDefaultDisplay().getRealMetrics(dm);
                  physicalW = dm.widthPixels;
                  physicalH = dm.heightPixels;
                  float scale = Math.min(1f, 450f / Math.max(physicalW, physicalH));
                  int w = Math.max(2, Math.round(physicalW * scale));
                  int h = Math.max(2, Math.round(physicalH * scale));
                  // VirtualDisplay and ImageReader sizes match: low bandwidth, around 1 frame/s.
                  captureThread = new HandlerThread("ScreenCapture");
                  captureThread.start();
                  reader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2);
                  reader.setOnImageAvailableListener(r -> {
                      Image image = null;
                      try {
                          image = r.acquireLatestImage();
                          if (image == null || SystemClock.elapsedRealtime() - lastFrameAt < 650) return;
                          Image.Plane p = image.getPlanes()[0];
                          ByteBuffer buffer = p.getBuffer();
                          int stride = p.getRowStride();
                          int pixel = p.getPixelStride();
                          if (pixel != 4 || stride < w * 4) return;
                          Bitmap wide = Bitmap.createBitmap(stride / pixel, h, Bitmap.Config.ARGB_8888);
                          wide.copyPixelsFromBuffer(buffer);
                          Bitmap crop = Bitmap.createBitmap(wide, 0, 0, w, h);
                          ByteArrayOutputStream bytes = new ByteArrayOutputStream(100_000);
                          crop.compress(Bitmap.CompressFormat.JPEG, 55, bytes);
                          lastFrame = bytes.toByteArray();
                          lastFrameAt = SystemClock.elapsedRealtime();
                          crop.recycle();
                          wide.recycle();
                      } catch (Exception e) {
                          android.util.Log.w("PhoneFarm", "Frame tidak bisa dibaca", e);
                      } finally { if (image != null) image.close(); }
                  }, new Handler(captureThread.getLooper()));
                  display = projection.createVirtualDisplay("CFMPhoneFarmScreen", w, h, dm.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.getSurface(), null, null);
              }
          
              private void startServer() throws IOException {
                  socket = new ServerSocket();
                  socket.setReuseAddress(true);
                  socket.bind(new InetSocketAddress("0.0.0.0", PORT));
                  acceptThread = new Thread(() -> {
                      while (!Thread.currentThread().isInterrupted() && socket != null && !socket.isClosed()) {
                          try {
                              Socket client = socket.accept();
                              client.setSoTimeout(4000);
                              clients.submit(() -> handle(client));
                          } catch (IOException | RejectedExecutionException e) {
                              if (socket != null && !socket.isClosed()) android.util.Log.w("PhoneFarm", "LAN server", e);
                          }
                      }
                  }, "PhoneFarmHttp");
                  acceptThread.start();
              }
          
              private void handle(Socket sock) {
                  try (Socket s = sock) {
                      if (!(s.getInetAddress().isSiteLocalAddress() || s.getInetAddress().isLoopbackAddress())) {
                          send(s, 403, "text/plain", "Jaringan ditolak".getBytes(StandardCharsets.UTF_8));
                          return;
                      }
                      BufferedReader br = new BufferedReader(new InputStreamReader(s.getInputStream(), StandardCharsets.ISO_8859_1));
                      String first = br.readLine();
                      if (first == null || first.length() > 2048) return;
                      String[] parts = first.split(" ");
                      if (parts.length != 3) return;
                      String token = "";
                      for (int i=0; i<40; i++) {
                          String header = br.readLine();
                          if (header == null || header.isEmpty()) break;
                          if (header.length() > 2048) return;
                          if (header.regionMatches(true, 0, "X-Farm-Token:", 0, 13)) token = header.substring(13).trim();
                      }
                      String correct = getSharedPreferences("farm", MODE_PRIVATE).getString("token", "");
                      if (correct.isEmpty() || !MessageDigest.isEqual(token.getBytes(StandardCharsets.UTF_8), correct.getBytes(StandardCharsets.UTF_8))) {
                          send(s, 401, "text/plain", "Kode salah".getBytes(StandardCharsets.UTF_8)); return;
                      }
                      String method = parts[0];
                      String route = parts[1].split("\\?", 2)[0];
                      Map<String, String> query = parseQuery(parts[1]);
                      if ("GET".equals(method) && "/status".equals(route)) {
                          JSONObject j = new JSONObject();
                          j.put("screen", lastFrame != null);
                          j.put("access", RemoteAccessibilityService.current != null);
                          j.put("width", physicalW);
                          j.put("height", physicalH);
                          send(s, 200, "application/json", j.toString().getBytes(StandardCharsets.UTF_8));
                      } else if ("GET".equals(method) && "/snapshot".equals(route)) {
                          byte[] frame = lastFrame;
                          if (frame == null) send(s, 503, "text/plain", "Menunggu gambar".getBytes(StandardCharsets.UTF_8));
                          else send(s, 200, "image/jpeg", frame);
                      } else if ("POST".equals(method) && "/gesture".equals(route)) {
                          RemoteAccessibilityService acc = RemoteAccessibilityService.current;
                          if (acc == null) { send(s, 409, "text/plain", "Aktifkan Accessibility".getBytes(StandardCharsets.UTF_8)); return; }
                          float x = fraction(query, "x"), y = fraction(query, "y");
                          float x2 = fraction(query, "x2"), y2 = fraction(query, "y2");
                          long duration = Math.max(70, Math.min(1500, Long.parseLong(query.getOrDefault("ms", "70"))));
                          acc.gesture(x, y, x2, y2, duration);
                          send(s, 200, "text/plain", "OK".getBytes(StandardCharsets.UTF_8));
                      } else if ("POST".equals(method) && "/key".equals(route)) {
                          RemoteAccessibilityService acc = RemoteAccessibilityService.current;
                          if (acc == null) { send(s, 409, "text/plain", "Aktifkan Accessibility".getBytes(StandardCharsets.UTF_8)); return; }
                          String code = query.getOrDefault("code", "");
                          if (!("back".equals(code) || "home".equals(code) || "recent".equals(code))) {
                              send(s, 400, "text/plain", "Tombol tidak dikenal".getBytes(StandardCharsets.UTF_8)); return;
                          }
                          acc.systemKey(code);
                          send(s, 200, "text/plain", "OK".getBytes(StandardCharsets.UTF_8));
                      } else {
                          send(s, 404, "text/plain", "Tidak ditemukan".getBytes(StandardCharsets.UTF_8));
                      }
                  } catch (Exception e) { android.util.Log.d("PhoneFarm", "Request gagal: " + e); }
              }
          
              private static float fraction(Map<String, String> q, String key) {
                  float v = Float.parseFloat(q.getOrDefault(key, "0"));
                  if (!Float.isFinite(v) || v < 0 || v > 1) throw new IllegalArgumentException("Koordinat tidak valid");
                  return v;
              }
          
              private static Map<String, String> parseQuery(String url) throws UnsupportedEncodingException {
                  Map<String, String> m = new HashMap<>();
                  int i = url.indexOf('?');
                  if (i < 0) return m;
                  for (String entry : url.substring(i+1).split("&")) {
                      String[] kv = entry.split("=", 2);
                      if (kv.length == 2) m.put(URLDecoder.decode(kv[0], "UTF-8"), URLDecoder.decode(kv[1], "UTF-8"));
                  }
                  return m;
              }
          
              private static void send(Socket s, int code, String type, byte[] data) throws IOException {
                  String label = code == 200 ? "OK" : code == 401 ? "Unauthorized" : code == 403 ? "Forbidden" : code == 404 ? "Not Found" : "Unavailable";
                  String h = "HTTP/1.1 " + code + " " + label + "\r\nContent-Type: " + type + "\r\nContent-Length: " + data.length + "\r\nConnection: close\r\nCache-Control: no-store\r\nX-Content-Type-Options: nosniff\r\n\r\n";
                  OutputStream out = s.getOutputStream();
                  out.write(h.getBytes(StandardCharsets.US_ASCII));
                  out.write(data);
                  out.flush();
              }
          
              @Override public void onDestroy() {
                  running = false;
                  try { if (socket != null) socket.close(); } catch (Exception ignored) { }
                  if (acceptThread != null) acceptThread.interrupt();
                  clients.shutdownNow();
                  try { if (display != null) display.release(); } catch (Exception ignored) { }
                  try { if (reader != null) reader.close(); } catch (Exception ignored) { }
                  try { if (projection != null) projection.stop(); } catch (Exception ignored) { }
                  if (captureThread != null) captureThread.quitSafely();
                  stopForeground(STOP_FOREGROUND_REMOVE);
                  super.onDestroy();
              }
          }
          __CFM_FARM_SOURCE_02_EOF__
          mkdir -p 'app/src/main/java/id/cfm/phonefarm'
          cat > 'app/src/main/java/id/cfm/phonefarm/MainActivity.java' <<'__CFM_FARM_SOURCE_03_EOF__'
          package id.cfm.phonefarm;
          
          import android.Manifest;
          import android.app.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.media.projection.MediaProjectionManager;
          import android.os.*;
          import android.provider.Settings;
          import android.text.InputType;
          import android.util.DisplayMetrics;
          import android.view.*;
          import android.widget.*;
          
          import org.json.*;
          
          import java.io.*;
          import java.net.*;
          import java.security.SecureRandom;
          import java.util.*;
          import java.util.concurrent.*;
          import java.util.concurrent.atomic.AtomicBoolean;
          
          /** One APK, two roles: hotspot controller and companion farm phone. */
          public class MainActivity extends Activity {
              private static final int REQ_CAPTURE = 42;
              private static final int REQ_NOTIFY = 43;
              private static final int BG = 0xFF0C1424;
              private static final int PANEL = 0xFF18243A;
              private static final int CARD = 0xFF202F49;
              private static final int BLUE = 0xFF5BA9FA;
              private static final int FG = 0xFFF2F5FC;
              private static final int SUB = 0xFFB4C4D9;
              private static final int GREEN = 0xFF69DCA8;
              private final Handler main = new Handler(Looper.getMainLooper());
              private final ExecutorService network = Executors.newFixedThreadPool(4);
              private final ArrayList<Device> devices = new ArrayList<>();
              private final AtomicBoolean fullLoading = new AtomicBoolean();
              private String view = "home";
              private Device selected;
              private LinearLayout root;
              private ImageView fullPreview;
              private TextView fullStatus;
              private TextView agentState;
          
              static class Device {
                  String name, ip, token;
                  ImageView preview;
                  TextView status;
                  Device(String n, String i, String t) { name=n; ip=i; token=t; }
              }
          
              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  loadDevices();
                  home();
              }
          
              @Override protected void onResume() {
                  super.onResume();
                  if ("agent".equals(view)) main.postDelayed(this::updateAgentState, 350);
              }
          
              private int dp(float n) { return Math.round(n * getResources().getDisplayMetrics().density); }
              private TextView text(String value, float size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(null, 1);
                  return t;
              }
              private android.graphics.drawable.GradientDrawable bg(int color, int radius) {
                  android.graphics.drawable.GradientDrawable d = new android.graphics.drawable.GradientDrawable();
                  d.setColor(color);
                  d.setCornerRadius(dp(radius));
                  return d;
              }
              private LinearLayout vertical() { LinearLayout c = new LinearLayout(this); c.setOrientation(LinearLayout.VERTICAL); return c; }
              private LinearLayout row() { LinearLayout c = new LinearLayout(this); c.setOrientation(LinearLayout.HORIZONTAL); c.setGravity(Gravity.CENTER_VERTICAL); return c; }
              private void pad(View v, int left, int top, int right, int bottom) { v.setPadding(dp(left), dp(top), dp(right), dp(bottom)); }
              private TextView action(String label, boolean primary, Runnable run) {
                  TextView b = text(label, 14, primary ? BG : FG, true);
                  b.setGravity(Gravity.CENTER);
                  pad(b, 12, 13, 12, 13);
                  b.setBackground(bg(primary ? BLUE : CARD, 13));
                  b.setOnClickListener(v -> run.run());
                  return b;
              }
              private void gap(LinearLayout layout, int px) { View g=new View(this); layout.addView(g, new LinearLayout.LayoutParams(1, dp(px))); }
              private void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }
              private void title(LinearLayout target, String header, String sub) {
                  TextView h = text(header, 23, FG, true); target.addView(h);
                  TextView s = text(sub, 13, SUB, false); pad(s, 0, 6, 0, 0); target.addView(s);
              }
          
              private void prepare(String mode) {
                  stopLoops();
                  view = mode;
                  root = vertical();
                  root.setBackgroundColor(BG);
                  setContentView(root);
              }
              private void stopLoops() {
                  main.removeCallbacks(gridLoop);
                  main.removeCallbacks(fullLoop);
              }
          
              private void home() {
                  prepare("home");
                  pad(root, 22, 38, 22, 20);
                  title(root, "CFM Phone Farm LAN", "Kelola perangkat sendiri lewat satu jaringan hotspot. Tanpa PC.");
                  gap(root, 30);
                  TextView intro=text("Pilih peran HP ini", 17, FG, true); root.addView(intro);
                  gap(root, 14);
                  root.addView(roleCard("▦  Mode Pengontrol", "Dipakai di HP utama yang menyalakan hotspot. Lihat daftar layar dan tap/swipe dari sini.", this::dashboard));
                  gap(root, 14);
                  root.addView(roleCard("▣  Mode Phone Farm", "Dipakai di setiap HP yang akan dikendalikan. Membagikan layar setelah kamu memberi izin.", this::agent));
                  gap(root, 24);
                  TextView note = text("Keamanan: setiap HP farm memerlukan izin perekaman layar, Accessibility, dan kode pairing. Gunakan hanya pada HP milikmu di hotspot pribadi.", 12, SUB, false);
                  root.addView(note);
              }
              private View roleCard(String title, String desc, Runnable fn) {
                  LinearLayout card = vertical(); pad(card, 20, 20, 20, 20); card.setBackground(bg(PANEL, 18));
                  card.addView(text(title, 18, FG, true)); gap(card, 9); card.addView(text(desc, 13, SUB, false));
                  card.setOnClickListener(v -> fn.run());
                  return card;
              }
          
              private void agent() {
                  prepare("agent");
                  ScrollView scroll = new ScrollView(this);
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, -1));
                  LinearLayout content = vertical(); pad(content, 20, 22, 20, 40); scroll.addView(content);
                  content.addView(action("‹  Kembali", false, this::home)); gap(content, 20);
                  title(content, "Mode Phone Farm", "Sambungkan HP ini ke hotspot HP pengontrol."); gap(content, 20);
          
                  LinearLayout info = vertical(); pad(info, 18, 18, 18, 18); info.setBackground(bg(PANEL, 17));
                  info.addView(text("Alamat IP HP farm", 12, SUB, false));
                  TextView addr = text(ips(), 17, FG, true); pad(addr,0,6,0,13); info.addView(addr);
                  info.addView(text("Kode pairing", 12, SUB, false));
                  String token = getToken();
                  TextView pair = text(token, 24, BLUE, true); pad(pair,0,7,0,9); pair.setLetterSpacing(0.10f); info.addView(pair);
                  info.addView(action("Salin kode", false, () -> {
                      ((android.content.ClipboardManager) getSystemService(CLIPBOARD_SERVICE)).setPrimaryClip(ClipData.newPlainText("Kode Farm", token));
                      toast("Kode disalin");
                  }));
                  gap(info, 8);
                  info.addView(action("Ganti kode pairing", false, () -> {
                      new AlertDialog.Builder(this).setTitle("Buat kode pairing baru?")
                          .setMessage("Semua HP pengontrol yang memakai kode lama akan terputus. Masukkan kode baru setelah penggantian.")
                          .setNegativeButton("Batal", null)
                          .setPositiveButton("Ganti kode", (dialog, which) -> {
                              byte[] bytes = new byte[6]; new SecureRandom().nextBytes(bytes);
                              StringBuilder fresh = new StringBuilder();
                              for (byte b : bytes) fresh.append(String.format(java.util.Locale.US, "%02X", b & 255));
                              getSharedPreferences("farm", MODE_PRIVATE).edit().putString("token", fresh.toString()).apply();
                              agent();
                          }).show();
                  }));
                  content.addView(info); gap(content, 16);
          
                  agentState = text("Status: memeriksa...", 13, SUB, false); content.addView(agentState); gap(content, 14);
                  content.addView(action("1. Aktifkan izin Accessibility", false, () -> {
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      toast("Cari layanan CFM Phone Farm LAN, lalu izinkan");
                  }));
                  gap(content, 10);
                  content.addView(action("2. Mulai berbagi layar + server", true, this::askCapture));
                  gap(content, 10);
                  content.addView(action("Hentikan berbagi layar", false, () -> {
                      stopService(new Intent(this, FarmService.class));
                      main.postDelayed(this::updateAgentState, 400);
                  }));
                  gap(content, 18);
                  content.addView(text("Di HP pengontrol: buka Mode Pengontrol → Tambah HP, lalu isi alamat IP dan kode di atas. Port jaringan: " + FarmService.PORT + ".\n\nJika Android melarang mengaktifkan Accessibility pada APK yang diinstal manual, buka Info aplikasi → menu ⋮ → Izinkan setelan terbatas (jika tersedia).\n\nJangan beri kode kepada orang lain. Kontrol hanya berfungsi selama layanan aktif.", 13, SUB, false));
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, REQ_NOTIFY);
                  }
                  updateAgentState();
              }
          
              private String ips() {
                  ArrayList<String> ips = new ArrayList<>();
                  try {
                      Enumeration<NetworkInterface> all = NetworkInterface.getNetworkInterfaces();
                      while (all.hasMoreElements()) {
                          NetworkInterface nic = all.nextElement();
                          if (!nic.isUp() || nic.isLoopback()) continue;
                          for (Enumeration<InetAddress> ae=nic.getInetAddresses(); ae.hasMoreElements();) {
                              InetAddress addr=ae.nextElement();
                              if (addr instanceof Inet4Address && addr.isSiteLocalAddress()) {
                                  String label = nic.getName() + ": " + addr.getHostAddress();
                                  if (nic.getName().startsWith("wlan")) ips.add(0,label); else ips.add(label);
                              }
                          }
                      }
                  } catch (Exception ignored) { }
                  return ips.isEmpty() ? "Belum ada IP WiFi. Sambungkan ke hotspot." : android.text.TextUtils.join("\n", ips);
              }
              private String getToken() {
                  android.content.SharedPreferences p = getSharedPreferences("farm", MODE_PRIVATE);
                  String old = p.getString("token", "");
                  if (!old.isEmpty()) return old;
                  byte[] b = new byte[6]; new SecureRandom().nextBytes(b);
                  StringBuilder s = new StringBuilder();
                  for (byte n:b) s.append(String.format(java.util.Locale.US,"%02X",n&0xff));
                  p.edit().putString("token",s.toString()).apply();
                  return s.toString();
              }
