              // ---------- koneksi ADB ----------
              private Dadb ensureAdb() throws IOException {
                  init();
                  synchronized (adbLock) {
                      if (stale) {
                          closeAdbLocked();
                          stale = false;
                      }
                      if (adb != null) return adb;
                      String pr = probe(host, port, 2500);
                      if (!"open".equals(pr)) {
                          if ("refused".equals(pr)) throw new IOException("Port " + port + " ditolak. Aktifkan ADB WiFi (adb tcpip " + port + ")");
                          if ("timeout".equals(pr)) throw new IOException("Tidak terjangkau di jaringan");
                          throw new IOException(pr);
