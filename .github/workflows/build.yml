                          "\nBerbagi layar: " + (on ? "AKTIF ✓" : "BELUM AKTIF") +
                          "\nPastikan IP yang disalin berasal dari WiFi/hotspot.");
              }
              private void askCapture() {
                  if (FarmService.running) { toast("Server sudah aktif"); return; }
                  try {
                      MediaProjectionManager mgr=(MediaProjectionManager)getSystemService(MEDIA_PROJECTION_SERVICE);
                      startActivityForResult(mgr.createScreenCaptureIntent(), REQ_CAPTURE);
                  } catch (Exception e) { toast("Tidak bisa meminta izin rekam layar: " + e.getMessage()); }
              }
              @Override protected void onActivityResult(int request, int result, Intent data) {
                  super.onActivityResult(request, result, data);
                  if (request == REQ_CAPTURE) {
                      if (result == RESULT_OK && data != null) {
                          Intent s = new Intent(this, FarmService.class).setAction(FarmService.ACTION_START)
                                  .putExtra(FarmService.EXTRA_CODE, result).putExtra(FarmService.EXTRA_DATA, data);
                          try {
                              if (Build.VERSION.SDK_INT >= 26) startForegroundService(s); else startService(s);
                              toast("Mengaktifkan server Phone Farm...");
                          } catch (Exception e) { toast("Gagal memulai: " + e.getMessage()); }
                          main.postDelayed(this::updateAgentState, 1200);
                      } else toast("Izin perekaman layar ditolak");
                  }
              }
          
              private void loadDevices() {
                  devices.clear();
