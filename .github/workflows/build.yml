          cat > app/src/main/assets/cfm-prelude.js <<'EOF_FILE'
          (function () {
            if (window.CFM) return;
            var N = window.CFMNative, cbs = {}, seq = 0, backFn = null;

            function call(fn, args) {
              return new Promise(function (res, rej) {
                if (!N) { rej(new Error('Jembatan CFM tidak tersedia')); return; }
                var id = String(++seq);
                cbs[id] = { res: res, rej: rej };
                try { N.invoke(id, fn, JSON.stringify(args || [])); }
                catch (e) { delete cbs[id]; rej(e); }
              });
            }

            window.__cfm_done = function (id, ok, val) {
              var c = cbs[id];
              if (!c) return;
              delete cbs[id];
              if (ok) c.res(val); else c.rej(new Error(String(val)));
            };

            function log(kind, msg) {
              try { N.invoke('0', 'log', JSON.stringify([kind, String(msg)])); } catch (e) {}
            }
            window.addEventListener('error', function (e) { log('error', (e.message || 'error') + ' @' + (e.lineno || 0)); });
            window.addEventListener('unhandledrejection', function (e) {
              var r = e.reason;
              log('promise', r && r.message ? r.message : r);
            });

            window.CFM = {
              // clipboard, berbagi, toast
              copy: function (t) { return call('copy', [String(t)]); },
              paste: function () { return call('paste'); },
              share: function (t) { return call('share', [String(t)]); },
              toast: function (m) { return call('toast', [String(m)]); },
              openUrl: function (u) { return call('openUrl', [String(u)]); },
              // simpan file lewat pemilih lokasi Android; resolve true bila tersimpan
              saveFile: function (name, text) { return call('saveFile', [String(name), String(text)]); },
              // penyimpanan per fitur (aman, tidak hilang saat fitur diperbarui)
              get: function (k) { return call('get', [String(k)]); },
              set: function (k, v) { return call('set', [String(k), String(v)]); },
              remove: function (k) { return call('remove', [String(k)]); },
              keys: function () { return call('keys'); },
              // jaringan
              netInfo: function () { return call('netInfo'); },
              netLog: function () { return call('netLog'); },
              checkPort: function (host, port, timeoutMs) { return call('checkPort', [String(host), Number(port), Number(timeoutMs || 2000)]); },
              fetch: function (url, opts) { return call('fetch', [String(url), opts || {}]); },
              // info fitur & aplikasi: {id, name, version, app}
              info: function () { return call('info'); },
              // event dari aplikasi: 'show', 'hide', 'net'
              on: function (name, fn) { window.addEventListener('cfm:' + name, fn); },
              // tombol Kembali: return true bila sudah ditangani fitur, selain itu kembali ke WebUI
              onBack: function (fn) { backFn = fn; },
              _back: function () { return backFn ? !!backFn() : false; }
            };
          })();
