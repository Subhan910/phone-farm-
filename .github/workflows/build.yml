              private static boolean privateIPv4(String ip) {
                  String[] p=ip.split("\\.");
                  if(p.length!=4) return false;
                  int[] a=new int[4];
                  try { for(int j=0;j<4;j++){ if(p[j].isEmpty()) return false; a[j]=Integer.parseInt(p[j]); if(a[j]<0||a[j]>255)return false;} }
                  catch(Exception e){return false;}
                  return a[0]==10 || (a[0]==172 && a[1]>=16 && a[1]<=31) || (a[0]==192 && a[1]==168);
              }
          
