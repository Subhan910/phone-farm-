                          byte[] data = request(d,"GET","/snapshot");
                          bitmap=BitmapFactory.decodeByteArray(data,0,data.length);
                          if (bitmap != null) { st="● Online"; color=GREEN; }
                      } catch (Exception e) {
                          if (e.getMessage() != null && e.getMessage().contains("401")) st = "● Kode pairing salah";
                          else if (e.getMessage() != null && e.getMessage().contains("503")) st = "● Menunggu izin layar";
                      }
                      final Bitmap result=bitmap;
                      final String status=st;
                      final int colorValue=color;
                      main.post(() -> {
