          /**
           * Cangkang aplikasi. Fitur-fitur (Catatan, IP, Kalkulator, dst.) bukan lagi kode Java,
           * melainkan berkas HTML di folder fitur aplikasi. Pasang / ganti HTML = upgrade fitur,
           * tanpa memasang ulang APK. Lihat assets/PLUGIN_GUIDE.md untuk format fitur.
           */
          public class MainActivity extends Activity {

              private static final String APP_VER = "3.2";
              private static final String HOME_HOST = "192.168.43.1";
              private static final String HOME = "http://192.168.43.1/";
              private static final String NAS_HOME = "http://192.168.43.1:8088/";
              private static final String ORIGIN = "https://plugin.cfm.local/";
              // design tokens (selaras dengan assets/cfm-ui.css)
              static final int BG = 0xFF0B0E14, SURF = 0xFF11151C, CARD = 0xFF171C26, CARD2 = 0xFF1E2431, LINE = 0xFF283041;
              static final int FG = 0xFFE8ECF3, DIM = 0xFF8F9BB0, ACC = 0xFF7AA7FF, ACC2 = 0xFF3E6BF0;
              static final int OK = 0xFF3DD68C, WARN = 0xFFF5B946, BAD = 0xFFFF6B6B;
              private static final int REQ_SAVE = 4242, REQ_FILE = 4243, REQ_IMPORT = 4244;
              private static final int MAX_HTML = 5 * 1024 * 1024;
              private static final Pattern TAG_META = Pattern.compile("<meta\\b[^>]*>", Pattern.CASE_INSENSITIVE);
              private static final String BACK_JS =
                      "(function(){try{return !!(window.CFM&&window.CFM._back&&window.CFM._back())}catch(e){return false}})()";

              private WebView web, nas;
              private FarmPane farm;
              private FrameLayout body;
              private TextView title;
              private String cur;
              private WebChromeClient chrome;
              private WebViewClient pluginClient;
              private String prelude = "";
              private SharedPreferences nasPrefs, plugPrefs;
              private ValueCallback<Uri[]> fileCb;
              private boolean nasTried, nasLoaded;
              private View customView;
              private WebChromeClient.CustomViewCallback customCb;
              private int savedUi;

              // ---- UI ----
              private final Handler ui = new Handler(Looper.getMainLooper());
              private FrameLayout shell, topTile, drawerLayer;
              private LinearLayout drawer;
              private View scrim, progBar, chipDot, srvDot;
              private TextView subtitle, chipTxt, srvTxt, snack;
              private boolean drawerOpen;
              private int drawerW, srv; // srv: 0 memeriksa, 1 online, 2 offline
              private String uiCss = "";
              private final Runnable snackHide = () -> {
                  if (snack == null) return;
                  snack.animate().alpha(0f).translationY(dp(16)).setDuration(180).withEndAction(() -> snack.setVisibility(View.GONE)).start();
              };
              private final Runnable statusTick = new Runnable() {
                  @Override
                  public void run() {
                      pollStatus();
                      ui.postDelayed(this, 9000);
                  }
              };

              // ---- fitur (plugin HTML) ----
              private static class Plugin {
                  String id = "", name = "", icon = "", ver = "1", updateUrl = "";
                  int order = 100;
                  File file;
              }

              private File plugDir;
              private final Map<String, Plugin> plugins = new LinkedHashMap<>();
              private final Map<String, Plugin> bundled = new HashMap<>();
              private final Map<String, String> bundledFile = new HashMap<>();
              private final Map<String, WebView> pluginViews = new HashMap<>();
              private final Map<String, String> lastErr = new ConcurrentHashMap<>();
              private final Set<String> removed = new HashSet<>();
              private final LinkedList<String[]> installQ = new LinkedList<>();
              private boolean installing;
              private View managePane;
              private LinearLayout manageList;
              private PluginBridge saveBridge;
              private String saveCid, saveText;

              // ---- jaringan ----
              private ConnectivityManager cm;
              private ConnectivityManager.NetworkCallback cb;
              private final Map<Network, String> names = new HashMap<>();
              private final StringBuilder logSb = new StringBuilder();
              private volatile String logSnap = "";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Window w = getWindow();
                  w.setStatusBarColor(SURF);
                  w.setNavigationBarColor(BG);

                  nasPrefs = getSharedPreferences("nas", MODE_PRIVATE);
                  plugPrefs = getSharedPreferences("plugins", MODE_PRIVATE);
                  removed.addAll(plugPrefs.getStringSet("removed", new HashSet<String>()));
                  plugDir = new File(getFilesDir(), "plugins");
                  plugDir.mkdirs();
                  try { prelude = readAsset("cfm-prelude.js"); } catch (Exception e) { prelude = ""; }
                  try { uiCss = readAsset("cfm-ui.css"); } catch (Exception e) { uiCss = ""; }
                  migrateNotes();
                  loadBundledMeta();
                  seedPlugins();
                  scanPlugins();
                  chrome = makeChrome();
                  pluginClient = makePluginClient();

                  shell = new FrameLayout(this);
                  shell.setBackgroundColor(BG);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);
                  body = new FrameLayout(this);
                  root.addView(topBar(), new LinearLayout.LayoutParams(-1, dp(56)));
                  root.addView(progressBar(), new LinearLayout.LayoutParams(-1, dp(2)));
                  root.addView(body, new LinearLayout.LayoutParams(-1, 0, 1));
                  shell.addView(root, new FrameLayout.LayoutParams(-1, -1));
                  shell.addView(buildDrawerLayer(), new FrameLayout.LayoutParams(-1, -1));
                  shell.addView(buildSnack());

                  // WebUI (Clash)
                  web = new WebView(this);
                  web.setBackgroundColor(BG);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) showError(v);
                      }

                      @SuppressWarnings("deprecation")
                      @Override
                      public void onReceivedError(WebView v, int code, String desc, String failingUrl) {
                          if (Build.VERSION.SDK_INT < 23 && HOME.equals(failingUrl)) showError(v);
                      }
                  });
                  web.setWebChromeClient(chrome);
                  if (b != null) web.restoreState(b); else web.loadUrl(HOME);

                  body.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  body.addView(buildNas(), new FrameLayout.LayoutParams(-1, -1));
                  farm = new FarmPane(this);
                  body.addView(farm.view(), new FrameLayout.LayoutParams(-1, -1));
                  body.addView(buildManager(), new FrameLayout.LayoutParams(-1, -1));

                  setContentView(shell);
                  show("webui");
                  startNetMonitor();
              }

              // ---------- util UI ----------
              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density + 0.5f); }

              void toast(String m) { flash(m, 2200); }

              void toastL(String m) { flash(m, 3800); }

              private void flash(final String m, final int ms) {
                  runOnUiThread(() -> {
                      if (snack == null) return;
                      snack.setText(m);
                      ui.removeCallbacks(snackHide);
                      snack.animate().cancel();
                      snack.setVisibility(View.VISIBLE);
                      snack.setAlpha(0f);
                      snack.setTranslationY(dp(16));
                      snack.animate().alpha(1f).translationY(0f).setDuration(180).start();
                      ui.postDelayed(snackHide, ms);
                  });
              }

              GradientDrawable shape(int color, int r) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(r));
                  return g;
              }

              GradientDrawable box(int color, int r, int stroke) {
                  GradientDrawable g = shape(color, r);
                  g.setStroke(dp(1), stroke);
                  return g;
              }

              private GradientDrawable dotShape(int color) {
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(color);
                  return g;
              }

              // latar + efek riak yang mengikuti sudut membulat (stroke 0 = tanpa garis tepi)
              Drawable rip(int bg, int r, int stroke) {
                  Drawable content = stroke == 0 ? shape(bg, r) : box(bg, r, stroke);
                  return new RippleDrawable(ColorStateList.valueOf(0x24FFFFFF), content, shape(Color.WHITE, r));
              }

