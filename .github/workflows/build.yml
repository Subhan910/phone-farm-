                  devs.clear();
                  try {
                      JSONArray a = new JSONArray(prefs.getString("devs", "[]"));
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject o = a.getJSONObject(i);
                          String host = o.optString("h", "");
                          if (host.isEmpty()) continue;
                          devs.add(new FarmDevice(o.optString("n", ""), host, o.optInt("p", 5555), this));
                      }
                  } catch (Exception ignored) { }
              }

              private void save() {
                  JSONArray a = new JSONArray();
                  try {
                      for (FarmDevice d : devs) {
                          JSONObject o = new JSONObject();
                          o.put("n", d.name == null ? "" : d.name);
                          o.put("h", d.host);
                          o.put("p", d.port);
                          a.put(o);
                      }
                  } catch (Exception ignored) { }
                  prefs.edit().putString("devs", a.toString()).apply();
              }

              private boolean has(String host, int port) {
                  for (FarmDevice d : devs) if (d.host.equals(host) && d.port == port) return true;
                  return false;
              }

              // ---------- callback dari FarmDevice (thread mana pun) ----------
              @Override
              public void onChanged(final FarmDevice d) {
                  ui.post(() -> {
                      if (!devs.contains(d)) return;
                      Tile t = tiles.get(d);
                      if (t != null) t.onState();
                      Detail dt = detail;
                      if (dt != null && dt.dev == d) dt.onState();
                      updateSummary();
                  });
              }

              // ---------- menentukan apa yang dikerjakan tiap HP ----------
              private void applyStreams() {
                  if (!active) return;
                  for (FarmDevice d : new ArrayList<>(devs)) {
                      Detail dt = detail;
                      if (dt != null) {
                          if (d == dt.dev) {
                              if (dt.surface != null && !d.usesSurface(dt.surface)) d.start(dt.surface, DETAIL);
                          } else if (sync) {
                              if (!(d.running() && d.usesSurface(null))) d.start(null, TINY);
                          } else {
                              d.stop();
                          }
                      } else {
                          Tile t = tiles.get(d);
                          if (t != null && t.surface != null && !d.usesSurface(t.surface)) d.start(t.surface, GRID[quality]);
                      }
                  }
              }

              // ---------- grid ----------
              private void rebuildGrid() {
                  for (Tile t : tiles.values()) t.dispose();
                  tiles.clear();
                  rows.removeAllViews();
                  if (devs.isEmpty()) {
                      rows.addView(emptyCard());
                      updateSummary();
                      return;
                  }
                  LinearLayout row = null;
                  for (int i = 0; i < devs.size(); i++) {
                      if (i % cols == 0) {
                          row = new LinearLayout(h);
                          rows.addView(row, new LinearLayout.LayoutParams(-1, -2));
                      }
                      FarmDevice d = devs.get(i);
                      Tile t = new Tile(d);
                      tiles.put(d, t);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, -2, 1);
                      lp.setMargins(dp(4), dp(4), dp(4), dp(4));
                      row.addView(t.card, lp);
                  }
                  int rem = devs.size() % cols;
                  if (rem != 0 && row != null) {
                      for (int k = rem; k < cols; k++) {
                          LinearLayout.LayoutParams sp = new LinearLayout.LayoutParams(0, 1, 1);
                          sp.setMargins(dp(4), dp(4), dp(4), dp(4));
                          row.addView(new View(h), sp);
                      }
                  }
                  for (Tile t : tiles.values()) t.refresh();
                  updateSummary();
              }

