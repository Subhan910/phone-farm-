                  EditText name=new EditText(this); name.setSingleLine(true); name.setHint("Nama (mis. OPPO A57)"); name.setText(existing==null?"":existing.name); fields.addView(name);
                  EditText ip=new EditText(this); ip.setSingleLine(true); ip.setInputType(InputType.TYPE_CLASS_TEXT);
                  ip.setHint("IP (mis. 192.168.43.21)"); ip.setText(existing==null?"":existing.ip); fields.addView(ip);
                  EditText token=new EditText(this); token.setSingleLine(true); token.setHint("Kode pairing (12 karakter)"); token.setText(existing==null?"":existing.token); fields.addView(token);
                  AlertDialog dialog = new AlertDialog.Builder(this).setTitle(existing==null?"Tambah HP phone farm":"Ubah HP")
                          .setView(fields).setPositiveButton("Simpan",null).setNegativeButton("Batal",null).create();
                  dialog.setOnShowListener(v -> dialog.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(clicked -> {
                      String n=name.getText().toString().trim(); String i=ip.getText().toString().trim(); String t=token.getText().toString().trim().toUpperCase(java.util.Locale.US);
                      if (n.isEmpty() || !privateIPv4(i) || !t.matches("[0-9A-F]{12}")) {
                          toast("Isi nama, IP WiFi privat, dan kode pairing 12 karakter yang benar."); return;
                      }
                      if (existing==null) devices.add(new Device(n,i,t));
