              // ---------- dialog bergaya (pengganti AlertDialog.Builder) ----------
              class Dlg {
                  private CharSequence title, msg, pos, neg;
                  private View view;
                  private CharSequence[] items;
                  private DialogInterface.OnClickListener posL, negL, itemL;
                  private DialogInterface.OnCancelListener cancelL;

                  Dlg(Context c) { }

                  Dlg setTitle(CharSequence t) { title = t; return this; }

                  Dlg setMessage(CharSequence m) { msg = m; return this; }

                  Dlg setView(View v) { view = v; return this; }

                  Dlg setItems(CharSequence[] it, DialogInterface.OnClickListener l) { items = it; itemL = l; return this; }

                  Dlg setPositiveButton(CharSequence t, DialogInterface.OnClickListener l) { pos = t; posL = l; return this; }

                  Dlg setNegativeButton(CharSequence t, DialogInterface.OnClickListener l) { neg = t; negL = l; return this; }

                  Dlg setOnCancelListener(DialogInterface.OnCancelListener l) { cancelL = l; return this; }

                  Dlg show() {
                      final Dialog d = new Dialog(MainActivity.this);
                      d.requestWindowFeature(Window.FEATURE_NO_TITLE);
                      LinearLayout panel = new LinearLayout(MainActivity.this);
                      panel.setOrientation(LinearLayout.VERTICAL);
                      panel.setBackground(box(CARD, 22, LINE));
                      panel.setPadding(dp(22), dp(22), dp(22), dp(14));
                      if (title != null) {
                          TextView t = text(title.toString(), 18, FG, true);
                          t.setPadding(0, 0, 0, dp(msg != null || view != null || items != null ? 10 : 4));
                          panel.addView(t);
                      }
                      if (msg != null) {
                          TextView m = text(msg.toString(), 14.5f, 0xFFC0C9DA, false);
                          m.setLineSpacing(0f, 1.18f);
                          panel.addView(m);
                      }
                      if (view != null) {
                          LinearLayout.LayoutParams vp = new LinearLayout.LayoutParams(-1, -2);
                          vp.setMargins(0, dp(10), 0, 0);
                          if (view.getParent() instanceof ViewGroup) ((ViewGroup) view.getParent()).removeView(view);
                          view.setPadding(0, 0, 0, 0);
                          panel.addView(view, vp);
                      }
                      if (items != null) {
                          for (int i = 0; i < items.length; i++) {
                              final int idx = i;
                              String s = items[i].toString();
                              TextView r = text(s, 15.5f, s.startsWith("Hapus") ? BAD : FG, false);
                              r.setPadding(dp(14), dp(14), dp(14), dp(14));
                              r.setBackground(rip(0x00000000, 12, 0));
                              r.setOnClickListener(v -> { d.dismiss(); if (itemL != null) itemL.onClick(d, idx); });
                              LinearLayout.LayoutParams ip = new LinearLayout.LayoutParams(-1, -2);
                              ip.setMargins(-dp(8), 0, -dp(8), 0);
                              panel.addView(r, ip);
                          }
                      }
                      if (pos != null || neg != null) {
                          LinearLayout bar = new LinearLayout(MainActivity.this);
                          bar.setGravity(Gravity.END | Gravity.CENTER_VERTICAL);
                          if (neg != null) {
                              TextView b = text(neg.toString(), 14.5f, DIM, true);
                              b.setGravity(Gravity.CENTER);
                              b.setPadding(dp(16), dp(11), dp(16), dp(11));
                              b.setBackground(rip(0x00000000, 12, 0));
                              b.setOnClickListener(v -> { d.dismiss(); if (negL != null) negL.onClick(d, DialogInterface.BUTTON_NEGATIVE); });
                              bar.addView(b);
                          }
                          if (pos != null) {
                              boolean danger = pos.toString().startsWith("Hapus");
                              TextView b = text(pos.toString(), 14.5f, Color.WHITE, true);
                              b.setGravity(Gravity.CENTER);
                              b.setPadding(dp(20), dp(11), dp(20), dp(11));
                              b.setBackground(rip(danger ? 0xFFD64545 : ACC2, 12, 0));
                              b.setOnClickListener(v -> { d.dismiss(); if (posL != null) posL.onClick(d, DialogInterface.BUTTON_POSITIVE); });
                              LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(-2, -2);
                              bp.setMargins(dp(6), 0, 0, 0);
                              bar.addView(b, bp);
                          }
                          LinearLayout.LayoutParams barp = new LinearLayout.LayoutParams(-1, -2);
                          barp.setMargins(0, dp(16), 0, 0);
                          panel.addView(bar, barp);
                      }
                      d.setContentView(panel);
                      if (cancelL != null) d.setOnCancelListener(cancelL);
                      Window dw = d.getWindow();
                      if (dw != null) {
                          dw.setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                          int sw = getResources().getDisplayMetrics().widthPixels;
                          dw.setLayout(Math.min(dp(400), sw - dp(40)), -2);
                          dw.setDimAmount(0.65f);
                          if (view != null) {
                              dw.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
                                      | WindowManager.LayoutParams.SOFT_INPUT_STATE_VISIBLE);
                          }
                      }
                      d.show();
                      return this;
                  }
              }

              private void show(String key) {
                  if (cur != null && cur.startsWith("p:") && !cur.equals(key)) dispatch(pluginViews.get(cur.substring(2)), "hide");
                  if ("farm".equals(cur) && !"farm".equals(key)) farm.onHide();
                  View target;
                  if (key.equals("webui")) {
                      target = web;
                  } else if (key.equals("nas")) {
                      target = nas;
                      if (!nasLoaded) { nasLoaded = true; nas.loadUrl(NAS_HOME); }
                  } else if (key.equals("farm")) {
                      target = farm.view();
                  } else if (key.equals("manage")) {
                      refreshManager();
                      target = managePane;
                  } else {
                      WebView v = pluginView(key.substring(2));
                      if (v == null) {
                          toast("Fitur tidak bisa dimuat");
                          key = "webui";
                          target = web;
                      } else {
                          target = v;
                      }
                  }
                  cur = key;
                  setHeader(key);
                  resetLoadBar();
                  for (int i = 0; i < body.getChildCount(); i++) body.getChildAt(i).setVisibility(View.GONE);
                  target.setVisibility(View.VISIBLE);
                  if (key.startsWith("p:")) dispatch(pluginViews.get(key.substring(2)), "show");
                  if ("farm".equals(key)) farm.onShow();
              }

              // dipanggil FarmPane saat status HP berubah: segarkan judul bila panel ini yang tampil
              void farmChanged() {
                  if ("farm".equals(cur) && title != null && subtitle != null) subtitle.setText(subOf("farm"));
              }

              void keepAwake(boolean on) {
                  if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
