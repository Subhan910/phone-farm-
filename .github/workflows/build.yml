              };
              private void sendCommand(Device d,String endpoint) {
                  network.execute(()->{
                      try {request(d,"POST",endpoint);}
                      catch(Exception e){main.post(()->{if("detail".equals(view))toast("Kontrol gagal. Cek Accessibility, IP, dan kode.");});}
                  });
              }
              private static byte[] request(Device d,String method,String path)throws IOException {
                  HttpURLConnection c=(HttpURLConnection)new URL("http://"+d.ip+":"+FarmService.PORT+path).openConnection();
                  try {
                      c.setConnectTimeout(1700); c.setReadTimeout(1900);c.setRequestMethod(method);
                      c.setRequestProperty("X-Farm-Token",d.token);
                      c.setUseCaches(false);
                      if("POST".equals(method)){c.setDoOutput(true);c.setFixedLengthStreamingMode(0);c.connect();c.getOutputStream().close();}
                      int status=c.getResponseCode();
                      if(status!=200)throw new IOException("HTTP "+status);
                      try(InputStream in=c.getInputStream();ByteArrayOutputStream out=new ByteArrayOutputStream()){
                          byte[] buffer=new byte[8192];int n;int size=0;
                          while((n=in.read(buffer))!=-1){size+=n;if(size>2_000_000)throw new IOException("Frame terlalu besar");out.write(buffer,0,n);}
                          return out.toByteArray();
                      }
                  }finally{c.disconnect();}
              }
          
