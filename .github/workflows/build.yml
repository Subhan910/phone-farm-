                  }

                  boolean onTouch(View v, MotionEvent e) {
                      int a = e.getActionMasked();
                      int act;
                      if (a == MotionEvent.ACTION_DOWN) act = FarmDevice.ACT_DOWN;
                      else if (a == MotionEvent.ACTION_MOVE) act = FarmDevice.ACT_MOVE;
                      else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) act = FarmDevice.ACT_UP;
                      else return true; // abaikan jari kedua
                      float w = v.getWidth(), hh = v.getHeight();
                      if (w <= 0 || hh <= 0) return true;
                      sendTouch(dev, act, clamp01(e.getX() / w), clamp01(e.getY() / hh));
                      return true;
                  }

                  void dispose() {
                      ui.removeCallbacks(retry);
                  }

