          <!doctype html>
          <html lang="id">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="cfm-id" content="catatan">
          <meta name="cfm-name" content="Catatan">
          <meta name="cfm-icon" content="📝">
          <meta name="cfm-version" content="2">
          <meta name="cfm-order" content="10">
          <meta name="cfm-ui" content="1">
          <title>Catatan</title>
          <style>
          html,body{height:100%;overflow:hidden}
          #app{height:100%}
          .screen{display:flex;flex-direction:column;height:100%}
          .search{position:relative;flex:1;min-width:0}
          .search .i{position:absolute;left:13px;top:50%;margin-top:-10px;color:var(--mute);pointer-events:none}
          .search .input{padding-left:42px;min-height:42px}
          .scroll{flex:1;overflow:auto;padding:4px 14px 96px;-webkit-overflow-scrolling:touch}
          .count{display:flex;align-items:center;justify-content:space-between;margin:12px 4px 8px;font-size:12px;color:var(--dim)}
          .note{margin:0 0 10px;padding:14px 16px}
          .note .t{font-weight:700;font-size:16px;line-height:1.3;word-break:break-word;display:flex;gap:8px;align-items:flex-start}
          .note .t span{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
          .note .t .i{color:var(--acc);margin-top:2px}
          .note .p{color:var(--dim);font-size:14px;margin-top:4px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
          .note .d{color:var(--mute);font-size:12px;margin-top:10px}
          .ti{border:0;outline:0;background:transparent;color:var(--text);padding:16px 18px 6px;font:700 24px/1.25 system-ui,sans-serif;letter-spacing:-.015em;width:100%}
          .bi{flex:1;border:0;outline:0;resize:none;background:transparent;color:#d7deea;padding:6px 18px 18px;font:16.5px/1.6 system-ui,sans-serif;width:100%;min-height:0}
          .stat{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--dim)}
          .saved{transition:opacity .2s}
          </style>
          </head>
          <body>
          <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
            <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
            <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
            <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></symbol>
            <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-4.2M8.6 13.4l6.8 4.2"/></symbol>
            <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
            <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></symbol>
            <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
          </svg>
          <div id="app"></div>
          <script>
          'use strict';
          var C = window.CFM || {
            get: function (k) { return Promise.resolve(localStorage.getItem(k)); },
            set: function (k, v) { localStorage.setItem(k, v); return Promise.resolve(true); },
            copy: function (t) { return navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.resolve(); },
            share: function (t) { if (navigator.share) return navigator.share({ text: t }); return Promise.resolve(); },
            toast: function () { return Promise.resolve(); },
            onBack: function () {}
          };
          var app = document.getElementById('app');
          var notes = [], cur = null, q = '', flushFn = null;

          function h(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text != null) e.textContent = text;
            return e;
          }
          function ico(name, cls) {
            var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            s.setAttribute('class', 'i' + (cls ? ' ' + cls : ''));
            var u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
            u.setAttribute('href', '#i-' + name);
            s.appendChild(u);
            return s;
          }
          function ibtn(name, label, fn, cls) {
            var b = h('button', 'ibtn' + (cls ? ' ' + cls : ''));
            b.type = 'button';
            b.setAttribute('aria-label', label);
            b.appendChild(ico(name));
            b.onclick = fn;
            return b;
          }
          function persist() {
            var clean = notes.map(function (n) { return { t: n.t, b: n.b, u: n.u, p: n.p ? 1 : 0 }; });
            return C.set('n', JSON.stringify(clean));
          }
          function words(s) { return (s.trim().match(/\S+/g) || []).length; }
          function when(ts) {
            if (!ts || ts < 1e11) return '';
            var d = new Date(ts), n = new Date(), p2 = function (x) { return (x < 10 ? '0' : '') + x; };
            var day = function (x) { return x.getFullYear() * 400 + x.getMonth() * 32 + x.getDate(); };
            if (day(d) === day(n)) return 'Hari ini, ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
            var y = new Date(n.getTime() - 864e5);
            if (day(d) === day(y)) return 'Kemarin, ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
            var o = { day: 'numeric', month: 'short' };
            if (d.getFullYear() !== n.getFullYear()) o.year = 'numeric';
            return d.toLocaleDateString('id-ID', o);
          }
          function ordered() {
            var l = notes.slice();
            l.sort(function (a, b) { return (b.p ? 1 : 0) - (a.p ? 1 : 0) || b.u - a.u; });
            if (q) {
              var k = q.toLowerCase();
              l = l.filter(function (n) { return (n.t + '\n' + n.b).toLowerCase().indexOf(k) >= 0; });
            }
            return l;
          }
          function blank(n) { return !n.t.trim() && !n.b.trim(); }

          /* ---------- daftar ---------- */
          function showList(keepFocus) {
            cur = null; flushFn = null;
            app.textContent = '';
            var s = h('div', 'screen fade-in');
            var bar = h('header', 'appbar');
            var sw = h('div', 'search');
            sw.appendChild(ico('search'));
            var qi = h('input', 'input');
            qi.type = 'search'; qi.placeholder = 'Cari catatan'; qi.value = q;
            qi.setAttribute('aria-label', 'Cari catatan');
            sw.appendChild(qi);
            bar.appendChild(sw);
            bar.appendChild(ibtn('save', 'Cadangkan semua', function () {
              if (!notes.length) { C.toast('Belum ada catatan'); return; }
              var all = notes.map(function (o) { return '== ' + (o.t || '') + ' ==\n' + (o.b || '') + '\n\n'; }).join('');
              C.share(all);
            }));
            s.appendChild(bar);

            var sc = h('div', 'scroll');
            var list = h('div');
            sc.appendChild(list);
            s.appendChild(sc);
            var fab = h('button', 'fab');
            fab.type = 'button'; fab.setAttribute('aria-label', 'Catatan baru');
            fab.appendChild(ico('plus'));
            fab.firstChild.setAttribute('style', 'width:26px;height:26px;stroke-width:2.4');
            fab.onclick = function () { openNote(null); };
            s.appendChild(fab);
            app.appendChild(s);

            function render() {
              list.textContent = '';
              var l = ordered();
              if (!notes.length) {
                var e = h('div', 'empty');
                e.appendChild(h('div', 'big', '📝'));
                e.appendChild(h('b', '', 'Belum ada catatan'));
                e.appendChild(h('div', '', 'Ketuk tombol + untuk membuat catatan pertama.'));
                list.appendChild(e);
                return;
              }
              if (!l.length) {
                var e2 = h('div', 'empty');
                e2.appendChild(h('div', 'big', '🔎'));
                e2.appendChild(h('b', '', 'Tidak ditemukan'));
                e2.appendChild(h('div', '', 'Tidak ada catatan yang cocok dengan "' + q + '".'));
                list.appendChild(e2);
                return;
              }
              list.appendChild(h('div', 'count', l.length + (q ? ' hasil' : ' catatan')));
              l.forEach(function (n) {
                var card = h('div', 'card tap note');
                var t = h('div', 't');
                t.appendChild(h('span', '', n.t || '(tanpa judul)'));
                if (n.p) t.appendChild(ico('pin', 'sm'));
                card.appendChild(t);
                var body = n.b.replace(/\s+/g, ' ').trim();
                if (body) card.appendChild(h('div', 'p', body.slice(0, 160)));
                var w = when(n.u);
                if (w) card.appendChild(h('div', 'd', w));
                card.onclick = function () { openNote(n); };
                list.appendChild(card);
              });
            }
            qi.oninput = function () { q = qi.value.trim(); render(); };
            render();
            if (keepFocus) qi.focus();
          }

          /* ---------- editor ---------- */
          function leave() {
            if (flushFn) flushFn();
            if (cur && blank(cur)) {
              var i = notes.indexOf(cur);
              if (i >= 0) { notes.splice(i, 1); persist(); }
            }
            showList();
          }
          function openNote(n) {
            var isNew = !n;
            cur = n || { t: '', b: '', u: Date.now(), p: 0 };
            app.textContent = '';
            var s = h('div', 'screen fade-in');
            var bar = h('header', 'appbar');
            bar.appendChild(ibtn('back', 'Kembali', leave));
            bar.appendChild(h('div', 'grow'));
            var pin = ibtn('pin', 'Sematkan', function () {
              cur.p = cur.p ? 0 : 1;
              pin.classList.toggle('on', !!cur.p);
              cur.u = Date.now();
              commit();
              C.toast(cur.p ? 'Disematkan' : 'Sematan dilepas');
            }, cur.p ? 'on' : '');
            bar.appendChild(pin);
            bar.appendChild(ibtn('copy', 'Salin', function () {
              C.copy((t.value ? t.value + '\n\n' : '') + b.value).then(function () { C.toast('Disalin'); });
            }));
            bar.appendChild(ibtn('share', 'Bagikan', function () { C.share(t.value + '\n\n' + b.value); }));
            bar.appendChild(ibtn('trash', 'Hapus', function () {
              if (blank(cur) || confirm('Hapus catatan ini?')) {
                clearTimeout(tm); flushFn = null;
                var i = notes.indexOf(cur);
                if (i >= 0) { notes.splice(i, 1); persist(); }
                cur = null;
                showList();
              }
            }));
            s.appendChild(bar);

            var t = h('input', 'ti'); t.placeholder = 'Judul'; t.value = cur.t; t.setAttribute('aria-label', 'Judul');
            var b = h('textarea', 'bi'); b.placeholder = 'Mulai menulis...'; b.value = cur.b; b.setAttribute('aria-label', 'Isi catatan');
            s.appendChild(t); s.appendChild(b);

            var st = h('div', 'stat');
            var cnt = h('span', '');
            var sv = h('span', 'chip ok saved');
            sv.appendChild(ico('check', 'sm'));
            var svt = h('span', '', 'Tersimpan');
            sv.appendChild(svt);
            st.appendChild(cnt); st.appendChild(sv);
            s.appendChild(st);
            app.appendChild(s);

            function stats() { cnt.textContent = words(b.value + ' ' + t.value) + ' kata · ' + b.value.length + ' karakter'; }
            function commit() {
              cur.t = t.value.trim(); cur.b = b.value;
              if (blank(cur)) return;
              if (notes.indexOf(cur) < 0) notes.push(cur);
              persist();
            }
            var tm;
            function later() {
              stats();
              cur.u = Date.now();
              sv.className = 'chip warn saved'; svt.textContent = 'Menyimpan...';
              clearTimeout(tm);
              tm = setTimeout(function () { commit(); sv.className = 'chip ok saved'; svt.textContent = 'Tersimpan'; }, 500);
            }
            t.oninput = b.oninput = later;
            flushFn = function () { clearTimeout(tm); commit(); };
            stats();
            if (isNew) t.focus();
          }

          C.onBack(function () {
            if (cur) { leave(); return true; }
            if (q) { q = ''; showList(); return true; }
            return false;
          });
          addEventListener('cfm:hide', function () { if (flushFn) flushFn(); });
          document.addEventListener('visibilitychange', function () { if (document.hidden && flushFn) flushFn(); });

          C.get('n').then(function (s) {
            try { notes = JSON.parse(s || '[]'); } catch (e) { notes = []; }
            if (!Array.isArray(notes)) notes = [];
            // catatan lama belum punya waktu: pertahankan urutan lama (yang terakhir ditambahkan di atas)
            notes = notes.map(function (n, i) {
              return { t: String(n.t || ''), b: String(n.b || ''), u: n.u || (i + 1), p: n.p ? 1 : 0 };
            });
            showList();
          });
          </script>
          </body>
          </html>
          EOF_FILE
          cat > app/src/main/assets/plugins/ip-jaringan.html <<'EOF_FILE'
          <!doctype html>
          <html lang="id">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="cfm-id" content="ip-jaringan">
          <meta name="cfm-name" content="IP &amp; Jaringan">
          <meta name="cfm-icon" content="🌐">
          <meta name="cfm-version" content="2">
          <meta name="cfm-order" content="20">
          <meta name="cfm-ui" content="1">
          <title>IP &amp; Jaringan</title>
          <style>
          .ifc{margin-bottom:10px;padding:14px 16px}
          .ifc .hd{display:flex;align-items:center;gap:10px;margin-bottom:4px}
          .ifc .nm{font:700 15px var(--mono);flex:1;min-width:0}
          .ip{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
          .ip:first-of-type{border-top:0}
          .ip .a{flex:1;min-width:0;font:14px var(--mono);word-break:break-all}
          .ip:active .a{color:var(--acc)}
          .ports{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
          .pc{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--dim);border-radius:999px;padding:7px 12px;font:600 12.5px system-ui,sans-serif}
          .pc.on{background:rgba(122,167,255,.15);border-color:rgba(122,167,255,.5);color:var(--acc)}
          .res{margin-top:12px}
          .rr{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
          .rr .a{flex:1;min-width:0}
          .rr .a b{font:600 14px var(--mono)}
          .rr .a small{display:block;color:var(--dim);font-size:12px;margin-top:1px}
          .rr .ms{color:var(--mute);font:12px var(--mono)}
          .tl{padding:6px 14px}
          .ev{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
          .ev:first-child{border-top:0}
          .ev .tm{flex:none;width:62px;color:var(--mute);font:12px var(--mono);padding-top:2px}
          .ev .tx{flex:1;min-width:0;font-size:13.5px;word-break:break-word}
          .ev .tx small{display:block;color:var(--dim);font:12px var(--mono);margin-top:2px}
          .spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
          </style>
          </head>
          <body>
          <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8M21 3v5h-5"/></symbol>
            <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
            <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
          </svg>
          <div class="page">
            <div class="row">
              <div class="grow"><h1 class="h1">IP &amp; Jaringan</h1><p class="sub" id="upd">Memuat...</p></div>
              <button class="btn sm" id="bRf" type="button"><svg class="i sm"><use href="#i-refresh"/></svg>Segarkan</button>
            </div>

            <div class="sec"><span>Antarmuka aktif</span><span class="chip" id="cnt">0</span></div>
            <div id="ifs"></div>

            <div class="sec"><span>Cek server</span></div>
            <div class="card">
              <label class="field" for="host">Alamat server</label>
              <input class="input mono" id="host" value="192.168.43.1" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Alamat server">
              <div class="ports" id="pc">
                <button class="pc" type="button" data-p="80">80 · WebUI</button>
                <button class="pc" type="button" data-p="9090">9090 · API</button>
                <button class="pc" type="button" data-p="8088">8088 · NAS</button>
              </div>
              <label class="field" for="ports">Port (pisahkan dengan koma)</label>
              <input class="input mono" id="ports" value="80,9090,8088" inputmode="numeric" placeholder="mis. 80,9090" aria-label="Port">
              <button class="btn pri blk" id="bChk" type="button" style="margin-top:14px"><svg class="i sm"><use href="#i-play"/></svg>Cek sekarang</button>
              <div class="res" id="chk" hidden></div>
            </div>

            <div class="sec"><span>Log jaringan</span><button class="btn sm ghost" id="bCp" type="button"><svg class="i sm"><use href="#i-copy"/></svg>Salin semua</button></div>
            <div class="card tl" id="log"></div>
          </div>
          <script>
          'use strict';
          var $ = function (s) { return document.querySelector(s); };
          function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
          var raw = { now: '', log: '' };

          function kind(n) {
            if (/^(ap|swlan|softap|wlan1)/i.test(n)) return ['Hotspot', 'acc'];
            if (/^(wlan|wifi)/i.test(n)) return ['Wi-Fi', 'ok'];
            if (/^(rmnet|ccmni|pdp|v4-rmnet|data|seth)/i.test(n)) return ['Seluler', 'warn'];
            if (/^(tun|tap|wg|ppp|ipsec)/i.test(n)) return ['VPN', 'acc'];
            if (/^(eth|usb|rndis)/i.test(n)) return ['Ethernet / USB', 'ok'];
            if (/^lo/i.test(n)) return ['Loopback', ''];
            return ['Lainnya', ''];
          }
          function copy(t) { CFM.copy(t).then(function () { CFM.toast('Disalin: ' + t); }); }

          function renderNow(s) {
            raw.now = s;
            var box = $('#ifs'); box.textContent = '';
            var items = [];
            s.split('\n').forEach(function (l) {
              var m = l.match(/^([^:\s]+):\s*(.+)$/);
              if (m) items.push({ n: m[1], ips: m[2].split(/,\s*/).filter(Boolean) });
            });
            $('#cnt').textContent = items.length;
            if (!items.length) {
              var e = el('div', 'card empty');
              e.appendChild(el('div', 'big', '📡'));
              e.appendChild(el('b', '', 'Tidak ada jaringan aktif'));
              e.appendChild(el('div', '', 'Hubungkan ke Wi-Fi atau aktifkan data seluler.'));
              box.appendChild(e);
              return;
            }
            items.forEach(function (it) {
              var c = el('div', 'card ifc fade-in'), hd = el('div', 'hd'), k = kind(it.n);
              hd.appendChild(el('span', 'nm', it.n));
              hd.appendChild(el('span', 'chip ' + k[1], k[0]));
              c.appendChild(hd);
              it.ips.forEach(function (ip) {
                var r = el('div', 'ip');
                r.appendChild(el('span', 'a', ip));
                r.appendChild(el('span', 'chip', ip.indexOf(':') >= 0 ? 'IPv6' : 'IPv4'));
                var ic = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                ic.setAttribute('class', 'i sm dim');
                var u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
                u.setAttribute('href', '#i-copy'); ic.appendChild(u); r.appendChild(ic);
                r.onclick = function () { copy(ip); };
                c.appendChild(r);
              });
              box.appendChild(c);
            });
          }

          function renderLog(s) {
            raw.log = s;
            var box = $('#log'); box.textContent = '';
            var lines = s.split('\n').filter(function (x) { return x.trim(); });
            if (!lines.length) { box.appendChild(el('div', 'empty', 'Belum ada kejadian jaringan.')); return; }
            lines.forEach(function (l) {
              var m = l.match(/^\[(\d\d:\d\d:\d\d)\]\s+Network\s+(up|down)\s+(.*)$/);
              var ev = el('div', 'ev');
              if (!m) { ev.appendChild(el('div', 'tx', l)); box.appendChild(ev); return; }
              ev.appendChild(el('div', 'tm', m[1]));
              var tx = el('div', 'tx'), up = m[2] === 'up', rest = m[3];
              var d = rest.match(/^(.*?),\s*address:\s*(.*?),\s*dns:\s*(.*)$/);
              var head = el('div');
              head.appendChild(el('span', 'chip ' + (up ? 'ok' : 'bad'), up ? 'Terhubung' : 'Putus'));
              head.appendChild(document.createTextNode('  ' + (d ? d[1] : rest)));
              tx.appendChild(head);
              if (d) tx.appendChild(el('small', '', (d[2] ? d[2] : '-') + '  ·  dns ' + (d[3] || '-')));
              ev.appendChild(tx);
              box.appendChild(ev);
            });
          }

          function refresh() {
            CFM.netInfo().then(renderNow);
            CFM.netLog().then(renderLog);
            var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
