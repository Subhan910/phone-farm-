              }
              private static float[] toFraction(ImageView v, float x, float y) {
                  if(v.getDrawable()==null) return null;
                  int imageW=v.getDrawable().getIntrinsicWidth(), imageH=v.getDrawable().getIntrinsicHeight();
                  if(imageW<1||imageH<1||v.getWidth()<1||v.getHeight()<1)return null;
                  float scale=Math.min(v.getWidth()/(float)imageW,v.getHeight()/(float)imageH);
                  float w=imageW*scale,h=imageH*scale;
                  float left=(v.getWidth()-w)/2f,top=(v.getHeight()-h)/2f;
                  float fx=(x-left)/w,fy=(y-top)/h;
                  if(fx<0||fx>1||fy<0||fy>1)return null;
                  return new float[]{fx,fy};
              }
              private final Runnable fullLoop=new Runnable(){
                  @Override public void run(){
                      if(!"detail".equals(view)||selected==null)return;
                      Device d=selected;
                      if(fullLoading.compareAndSet(false,true))network.execute(()->{
                          Bitmap bmp=null;String status="● Offline / cek IP dan kode";int c=0xFFFF8E8E;
                          try {
                              byte[] data=request(d,"GET","/snapshot");
                              bmp=BitmapFactory.decodeByteArray(data,0,data.length);
                              if(bmp!=null){status="● Online  ·  tap atau geser layar";c=GREEN;}
                          }catch(Exception e){
                              if(e.getMessage()!=null && e.getMessage().contains("401"))status="● Kode pairing salah";
                              else if(e.getMessage()!=null && e.getMessage().contains("503"))status="● Belum ada gambar dari HP farm";
                          }
                          final Bitmap frame=bmp;final String txt=status;final int color=c;
                          main.post(()->{
                              if("detail".equals(view)&&selected==d){
                                  if(fullPreview!=null)fullPreview.setImageBitmap(frame);
                                  if(fullStatus!=null){fullStatus.setText(d.ip + "  ·  " + txt);fullStatus.setTextColor(color);}
