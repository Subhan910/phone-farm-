                      String raw = getSharedPreferences("controller", MODE_PRIVATE).getString("list", "[]");
                      JSONArray j = new JSONArray(raw);
                      for (int i=0; i<j.length(); i++) {
                          JSONObject d=j.getJSONObject(i);
                          devices.add(new Device(d.optString("name"),d.optString("ip"),d.optString("token")));
