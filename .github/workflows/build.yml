                  fullPreview.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  root.addView(fullPreview,new LinearLayout.LayoutParams(-1,0,1));
                  final float[] start=new float[2]; final long[] startMs={0};
                  fullPreview.setOnTouchListener((v,e)->{
                      if (e.getActionMasked()==MotionEvent.ACTION_DOWN) {
                          float[] xy=toFraction(fullPreview,e.getX(),e.getY());
                          if(xy==null)return true;
                          start[0]=xy[0];start[1]=xy[1];startMs[0]=SystemClock.elapsedRealtime(); return true;
                      }
                      if(e.getActionMasked()==MotionEvent.ACTION_UP){
                          float[] xy=toFraction(fullPreview,e.getX(),e.getY());
                          if(xy!=null && startMs[0]!=0){
                              long dt=SystemClock.elapsedRealtime()-startMs[0];
                              float move=Math.abs(start[0]-xy[0])+Math.abs(start[1]-xy[1]);
                              long dur=move>0.025f ? Math.max(140,Math.min(1300,dt)) : 70;
                              String path=String.format(java.util.Locale.US,"/gesture?x=%.4f&y=%.4f&x2=%.4f&y2=%.4f&ms=%d",start[0],start[1],xy[0],xy[1],dur);
                              sendCommand(d,path);
                          }
                          startMs[0]=0; return true;
                      }
                      return true;
                  });
                  LinearLayout buttons=row(); pad(buttons,10,10,10,18); root.addView(buttons);
                  addButton(buttons,"◀  Back",()->sendCommand(d,"/key?code=back"));
                  addButton(buttons,"⌂  Home",()->sendCommand(d,"/key?code=home"));
                  addButton(buttons,"▢  Recent",()->sendCommand(d,"/key?code=recent"));
