name: Build CFM WebUI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Buat proyek Android
        run: |
          set -e
          mkdir -p webui-app && cd webui-app
          mkdir -p app app/src/main app/src/main/java/id/cfm/webui app/src/main/res/drawable app/src/main/assets/plugins app/src/main/res/values app/src/main/res/drawable-anydpi-v26
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CFMWebUI"
          include ':app'
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=true
          EOF_FILE
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'id.cfm.webui'
              compileSdk 34

              defaultConfig {
                  applicationId 'id.cfm.webui'
                  minSdk 21
                  targetSdk 34
                  versionCode 11
                  versionName '3.2'
              }

              signingConfigs {
                  fixed {
                      storeFile file('fixed.p12')
                      storeType 'pkcs12'
                      storePassword 'cfmwebui'
                      keyAlias 'cfm'
                      keyPassword 'cfmwebui'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixed
                  }
              }
          }

          dependencies {
              implementation 'dev.mobile:dadb:1.2.10'
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="CFM WebUI"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:hardwareAccelerated="true"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode|density|fontScale|layoutDirection"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
