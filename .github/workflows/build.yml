              private static void generateKeys(File priv, File pub) throws Exception {
                  KeyPairGenerator g = KeyPairGenerator.getInstance("RSA");
                  g.initialize(2048);
                  KeyPair kp = g.generateKeyPair();
                  byte[] adb = adbPublicKey((RSAPublicKey) kp.getPublic());
                  String line = Base64.encodeToString(adb, Base64.NO_WRAP) + " cfm@android";
                  writeBytes(priv, kp.getPrivate().getEncoded());
                  writeBytes(pub, line.getBytes("UTF-8"));
              }

              private static AdbKeyPair loadKeys(File priv, File pub) throws Exception {
                  PrivateKey pk = KeyFactory.getInstance("RSA").generatePrivate(new PKCS8EncodedKeySpec(readBytes(priv)));
                  byte[] line = readBytes(pub);
                  byte[] withNul = Arrays.copyOf(line, line.length + 1); // ADB mengharapkan akhiran NUL
                  return new AdbKeyPair(pk, withNul);
