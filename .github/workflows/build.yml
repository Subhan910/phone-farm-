          function calc(e) {
            var s = e.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-'), p = 0;
            function pe() {
              var v = pt();
              while (p < s.length) {
                var c = s[p];
                if (c === '+') { p++; v += pt(); } else if (c === '-') { p++; v -= pt(); } else break;
              }
              return v;
            }
            function pt() {
              var v = pf();
              while (p < s.length) {
                var c = s[p];
                if (c === '*') { p++; v *= pf(); } else if (c === '/') { p++; v /= pf(); } else break;
              }
              return v;
            }
            function pf() {
              if (p >= s.length) throw new Error('x');
              var c = s[p];
              if (c === '-') { p++; return -pf(); }
              if (c === '+') { p++; return pf(); }
              var v;
              if (c === '(') {
