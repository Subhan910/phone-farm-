                  p2.setMargins(0, dp(8), 0, 0);
                  box.addView(nm, p2);
                  box.addView(pt, p2);
                  TextView hint = h.text("Pisahkan beberapa alamat dengan koma, spasi, atau baris baru. Rentang 101-110 menambah 10 HP sekaligus.",
                          11.5f, MainActivity.DIM, false);
                  hint.setPadding(0, dp(8), 0, 0);
                  box.addView(hint);
                  h.new Dlg(h).setTitle("Tambah HP").setView(box)
                          .setPositiveButton("Tambah", (dlg, w) -> {
                              int port;
                              try {
                                  port = Integer.parseInt(pt.getText().toString().trim());
                              } catch (Exception ex) {
                                  port = 5555;
                              }
                              if (port < 1 || port > 65535) port = 5555;
                              List<String[]> list = parseTargets(ip.getText().toString(), port);
                              if (list == null) {
                                  h.toastL("Alamat tidak valid atau terlalu banyak (maks 64)");
                                  return;
                              }
                              String name = nm.getText().toString().trim();
                              int added = 0;
                              for (String[] t : list) {
                                  int pp = Integer.parseInt(t[1]);
                                  if (has(t[0], pp)) continue;
                                  devs.add(new FarmDevice(list.size() == 1 ? name : "", t[0], pp, FarmPane.this));
                                  added++;
                              }
                              if (added == 0) {
                                  h.toast("HP sudah ada di daftar");
                                  return;
                              }
                              save();
                              rebuildGrid();
                              h.toast(added + " HP ditambahkan");
                          })
                          .setNegativeButton("Batal", null).show();
              }

              /** Mengurai input alamat. Mengembalikan pasangan {host, port}, atau null bila salah. */
              private List<String[]> parseTargets(String input, int defPort) {
                  List<String[]> out = new ArrayList<>();
                  String[] toks = input.trim().split("[,;\\s]+");
                  for (String tok : toks) {
                      if (tok.isEmpty()) continue;
                      Matcher m = IP_TOKEN.matcher(tok);
                      if (m.matches()) {
                          int[] o = new int[4];
                          for (int i = 0; i < 4; i++) o[i] = Integer.parseInt(m.group(i + 1));
                          for (int v : o) if (v > 255) return null;
                          int last = m.group(5) != null ? Integer.parseInt(m.group(5)) : o[3];
                          if (last < o[3] || last > 255) return null;
                          int port = m.group(6) != null ? Integer.parseInt(m.group(6)) : defPort;
                          if (port < 1 || port > 65535) return null;
                          for (int x = o[3]; x <= last; x++) out.add(new String[]{o[0] + "." + o[1] + "." + o[2] + "." + x, String.valueOf(port)});
                      } else {
                          Matcher hm = HOST_TOKEN.matcher(tok);
                          if (!hm.matches()) return null;
                          int port = hm.group(2) != null ? Integer.parseInt(hm.group(2)) : defPort;
                          if (port < 1 || port > 65535) return null;
                          out.add(new String[]{hm.group(1), String.valueOf(port)});
                      }
                      if (out.size() > 64) return null;
                  }
                  return out.isEmpty() ? null : out;
              }

              private void editDialog(final FarmDevice d) {
                  LinearLayout box = new LinearLayout(h);
                  box.setOrientation(LinearLayout.VERTICAL);
                  final EditText nm = h.edit("Nama");
                  nm.setText(d.name);
                  final EditText ip = h.edit("Alamat IP");
                  ip.setText(d.host);
                  final EditText pt = h.edit("Port");
                  pt.setInputType(InputType.TYPE_CLASS_NUMBER);
                  pt.setText(String.valueOf(d.port));
                  box.addView(nm);
                  LinearLayout.LayoutParams p2 = new LinearLayout.LayoutParams(-1, -2);
                  p2.setMargins(0, dp(8), 0, 0);
                  box.addView(ip, p2);
                  box.addView(pt, p2);
                  h.new Dlg(h).setTitle("Ubah HP").setView(box)
                          .setPositiveButton("Simpan", (dlg, w) -> {
                              String host = ip.getText().toString().trim();
                              int port;
                              try {
                                  port = Integer.parseInt(pt.getText().toString().trim());
                              } catch (Exception ex) {
                                  port = -1;
                              }
                              if (!HOST_TOKEN.matcher(host).matches() || host.contains(":") || port < 1 || port > 65535) {
                                  h.toastL("Alamat atau port tidak valid");
                                  return;
                              }
                              String name = nm.getText().toString().trim();
                              int idx = devs.indexOf(d);
                              if (idx < 0) return;
                              if (!(host.equals(d.host) && port == d.port) && has(host, port)) {
                                  h.toast("Alamat itu sudah ada di daftar");
                                  return;
                              }
                              if (host.equals(d.host) && port == d.port) {
                                  d.name = name;
                              } else {
                                  d.stop();
                                  devs.set(idx, new FarmDevice(name, host, port, FarmPane.this));
                              }
                              save();
                              rebuildGrid();
                          })
                          .setNegativeButton("Batal", null).show();
              }

              // ---------- pindai jaringan ----------
              private void scan() {
                  if (scanning) return;
                  final Set<String> own = new LinkedHashSet<>();
                  final Set<String> bases = new LinkedHashSet<>();
                  try {
                      Enumeration<NetworkInterface> en = NetworkInterface.getNetworkInterfaces();
                      while (en != null && en.hasMoreElements()) {
                          NetworkInterface ni = en.nextElement();
                          if (ni.isLoopback() || !ni.isUp()) continue;
                          for (InterfaceAddress ia : ni.getInterfaceAddresses()) {
                              if (!(ia.getAddress() instanceof Inet4Address)) continue;
                              Inet4Address a = (Inet4Address) ia.getAddress();
                              if (!a.isSiteLocalAddress()) continue;
                              String s = a.getHostAddress();
                              own.add(s);
                              bases.add(s.substring(0, s.lastIndexOf('.') + 1));
                          }
                      }
                  } catch (Exception ignored) { }
                  if (bases.isEmpty()) {
                      h.toastL("Tidak ada jaringan WiFi atau hotspot yang aktif");
                      return;
                  }
                  scanning = true;
                  scanDone = 0;
                  scanTotal = bases.size() * 254;
                  updateSummary();
                  final List<String> found = Collections.synchronizedList(new ArrayList<String>());
                  final AtomicInteger left = new AtomicInteger(scanTotal);
                  final ExecutorService ex = Executors.newFixedThreadPool(48);
                  for (final String base : bases) {
                      for (int i = 1; i <= 254; i++) {
                          final String ipAddr = base + i;
                          ex.execute(() -> {
                              if (!own.contains(ipAddr) && "open".equals(FarmDevice.probe(ipAddr, 5555, 450))) found.add(ipAddr);
                              final int rem = left.decrementAndGet();
                              if (rem == 0) {
                                  ui.post(() -> finishScan(found));
                              } else if (rem % 10 == 0) {
                                  ui.post(() -> {
                                      scanDone = scanTotal - rem;
                                      if (scanning) updateSummary();
                                  });
                              }
                          });
                      }
                  }
                  ex.shutdown();
              }

              private void finishScan(List<String> found) {
                  scanning = false;
                  updateSummary();
                  final List<String> fresh = new ArrayList<>();
                  synchronized (found) {
                      for (String ipAddr : found) if (!has(ipAddr, 5555)) fresh.add(ipAddr);
                  }
                  Collections.sort(fresh, (a, b) -> {
                      String[] x = a.split("\\."), y = b.split("\\.");
                      for (int i = 0; i < 4; i++) {
                          int c = Integer.compare(Integer.parseInt(x[i]), Integer.parseInt(y[i]));
                          if (c != 0) return c;
                      }
                      return 0;
                  });
                  if (fresh.isEmpty()) {
                      h.toastL(found.isEmpty()
                              ? "Tidak ada HP dengan ADB WiFi (port 5555) di jaringan ini. Ketuk Panduan."
                              : "Semua HP yang ditemukan sudah ada di daftar");
                      return;
                  }
                  final boolean[] sel = new boolean[fresh.size()];
                  LinearLayout list = new LinearLayout(h);
                  list.setOrientation(LinearLayout.VERTICAL);
                  for (int i = 0; i < fresh.size(); i++) {
                      final int idx = i;
                      sel[i] = true;
                      final TextView r = h.text("", 15, MainActivity.FG, false);
                      r.setPadding(dp(14), dp(12), dp(14), dp(12));
                      r.setOnClickListener(v -> {
                          sel[idx] = !sel[idx];
                          markRow(r, fresh.get(idx), sel[idx]);
                      });
                      markRow(r, fresh.get(i), true);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                      lp.setMargins(0, dp(2), 0, dp(2));
                      list.addView(r, lp);
                  }
                  MaxScroll ms = new MaxScroll(h, dp(300));
                  ms.addView(list, new FrameLayout.LayoutParams(-1, -2));
                  h.new Dlg(h).setTitle("Ditemukan " + fresh.size() + " HP").setMessage("HP dengan ADB WiFi aktif di port 5555:")
                          .setView(ms)
                          .setPositiveButton("Tambahkan", (dlg, w) -> {
                              int added = 0;
                              for (int i = 0; i < fresh.size(); i++) {
                                  if (sel[i] && !has(fresh.get(i), 5555)) {
                                      devs.add(new FarmDevice("", fresh.get(i), 5555, FarmPane.this));
                                      added++;
                                  }
                              }
                              if (added > 0) {
                                  save();
                                  rebuildGrid();
                                  h.toast(added + " HP ditambahkan");
                              }
                          })
                          .setNegativeButton("Batal", null).show();
              }

              private void markRow(TextView r, String ipAddr, boolean on) {
                  r.setText((on ? "✓  " : "○  ") + ipAddr);
                  r.setTextColor(on ? MainActivity.FG : MainActivity.DIM);
                  r.setBackground(on ? h.rip(0x337AA7FF, 12, MainActivity.ACC) : h.rip(MainActivity.CARD2, 12, MainActivity.LINE));
              }

              // ---------- semua HP ----------
              private void allMenu() {
                  if (devs.isEmpty()) {
                      h.toast("Belum ada HP");
                      return;
                  }
                  final CharSequence[] it = {"Home ke semua HP", "Kembali ke semua HP", "Aplikasi terbaru ke semua HP",
                          "Tombol daya ke semua HP", "Jalankan perintah shell...", "Sambungkan ulang semua", "Hentikan semua"};
                  h.new Dlg(h).setTitle("Semua HP").setItems(it, (dlg, i) -> {
                      if (i <= 3) {
                          final int code = i == 0 ? FarmDevice.KEY_HOME : i == 1 ? FarmDevice.KEY_BACK : i == 2 ? FarmDevice.KEY_RECENTS : FarmDevice.KEY_POWER;
                          each(d -> d.key(code));
                          h.toast("Dikirim ke " + devs.size() + " HP");
                      } else if (i == 4) {
                          shellDialog(new ArrayList<>(devs), "semua HP (" + devs.size() + ")");
                      } else if (i == 5) {
                          for (Tile t : tiles.values()) t.retries = 0;
                          each(d -> d.invalidate());
                          if (detail == null) {
                              for (FarmDevice d : devs) {
                                  Tile t = tiles.get(d);
                                  if (active && t != null && t.surface != null) d.start(t.surface, GRID[quality]);
                              }
                          }
                      } else {
                          each(d -> d.stop());
                      }
                  }).show();
              }

              private void shellDialog(final List<FarmDevice> targets, String who) {
                  LinearLayout box = new LinearLayout(h);
                  box.setOrientation(LinearLayout.VERTICAL);
                  final EditText e = h.edit("mis. monkey -p com.android.chrome 1");
                  e.setText(prefs.getString("cmd", ""));
                  e.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_MULTI_LINE | InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS);
                  e.setMinLines(2);
                  e.setGravity(Gravity.TOP | Gravity.START);
                  box.addView(e);
                  TextView hint = h.text("Contoh: input tap 540 1200 · am force-stop com.android.chrome · svc wifi disable · "
                          + "settings put system screen_brightness 80", 11.5f, MainActivity.DIM, false);
                  hint.setPadding(0, dp(8), 0, 0);
                  box.addView(hint);
                  h.new Dlg(h).setTitle("Perintah shell ke " + who).setView(box)
                          .setPositiveButton("Jalankan", (dlg, w) -> {
                              String cmd = e.getText().toString().trim();
                              if (cmd.isEmpty()) return;
                              prefs.edit().putString("cmd", cmd).apply();
                              runShell(targets, cmd);
                          })
                          .setNegativeButton("Batal", null).show();
              }

              private void runShell(final List<FarmDevice> targets, final String cmd) {
                  final String[] lines = new String[targets.size()];
                  final AtomicInteger pending = new AtomicInteger(targets.size());
                  h.toast("Menjalankan di " + targets.size() + " HP...");
                  for (int i = 0; i < targets.size(); i++) {
                      final int idx = i;
                      targets.get(i).exec(cmd, (d, out, err) -> {
                          String o = out == null ? "" : out.trim();
                          if (err != null) {
                              lines[idx] = d.label() + "  ·  GAGAL: " + err;
                          } else if (o.isEmpty()) {
                              lines[idx] = d.label() + "  ·  selesai";
                          } else {
                              if (o.length() > (targets.size() == 1 ? 4000 : 160)) o = o.substring(0, targets.size() == 1 ? 4000 : 160) + "…";
                              lines[idx] = d.label() + "  ·  " + (targets.size() == 1 ? "\n" : "") + o;
                          }
                          if (pending.decrementAndGet() == 0) {
                              ui.post(() -> {
                                  StringBuilder sb = new StringBuilder();
                                  for (String l : lines) {
                                      if (sb.length() > 0) sb.append("\n\n");
                                      sb.append(l);
                                  }
                                  TextView t = h.text(sb.toString(), 13, 0xFFC0C9DA, false);
                                  t.setTextIsSelectable(true);
                                  MaxScroll ms = new MaxScroll(h, dp(320));
                                  ms.addView(t, new FrameLayout.LayoutParams(-1, -2));
                                  h.new Dlg(h).setTitle("Hasil").setView(ms).setPositiveButton("Tutup", null).show();
                              });
                          }
                      });
                  }
              }

              // ---------- panduan ----------
              private void guide() {
                  String s = "Agar HP bisa dikontrol lewat WiFi, aktifkan ADB WiFi di tiap HP (sekali saja):\n\n"
                          + "1. Di HP: Opsi pengembang → aktifkan Debugging USB.\n"
                          + "2. Colok HP ke komputer dengan USB, lalu jalankan:  adb tcpip 5555  dan cabut USB.\n"
                          + "3. Pastikan HP ini dan semua HP farm ada di WiFi / hotspot yang sama.\n"
                          + "4. Ketuk Pindai WiFi, pilih HP yang ditemukan.\n"
                          + "5. Pertama kali, HP menampilkan dialog \"Izinkan debugging\": centang Selalu izinkan lalu Izinkan.\n\n"
                          + "Catatan: setelah HP restart, langkah 2 perlu diulang (kecuali HP root: setprop persist.adb.tcp.port 5555). "
                          + "Debugging nirkabel Android 11+ (kode pairing) belum didukung. "
                          + "Layar farm ditampilkan hanya saat panel ini terbuka, dan makin banyak HP makin berat; "
                          + "pakai Kualitas Hemat bila terasa patah-patah.";
                  TextView t = h.text(s, 13.5f, 0xFFC0C9DA, false);
                  t.setLineSpacing(0f, 1.15f);
                  MaxScroll ms = new MaxScroll(h, dp(380));
                  ms.addView(t, new FrameLayout.LayoutParams(-1, -2));
                  h.new Dlg(h).setTitle("Cara menyiapkan HP").setView(ms).setPositiveButton("Mengerti", null).show();
              }
