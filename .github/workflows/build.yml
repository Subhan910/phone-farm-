          package id.cfm.phonefarm;
          
          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Display;
          import android.util.DisplayMetrics;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          
          /** User must explicitly enable this service on EACH farm phone. */
          public class RemoteAccessibilityService extends AccessibilityService {
              static volatile RemoteAccessibilityService current;
              private final Handler main = new Handler(Looper.getMainLooper());
          
              @Override protected void onServiceConnected() { super.onServiceConnected(); current = this; }
              @Override public void onAccessibilityEvent(AccessibilityEvent event) { }
              @Override public void onInterrupt() { }
              @Override public boolean onUnbind(android.content.Intent intent) { current = null; return super.onUnbind(intent); }
              @Override public void onDestroy() { current = null; super.onDestroy(); }
          
              void gesture(float x, float y, float x2, float y2, long duration) {
                  main.post(() -> {
                      DisplayMetrics dm = new DisplayMetrics();
                      WindowManager wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                      Display display = wm.getDefaultDisplay();
                      display.getRealMetrics(dm);
                      Path p = new Path();
                      p.moveTo(bound(x) * (dm.widthPixels - 1), bound(y) * (dm.heightPixels - 1));
                      if (duration > 100) p.lineTo(bound(x2) * (dm.widthPixels - 1), bound(y2) * (dm.heightPixels - 1));
                      GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(p, 0, duration > 100 ? Math.min(2000, duration) : 70);
                      dispatchGesture(new GestureDescription.Builder().addStroke(stroke).build(), null, null);
                  });
              }
          
              void systemKey(String name) {
                  main.post(() -> {
                      int action = "home".equals(name) ? GLOBAL_ACTION_HOME : "back".equals(name) ? GLOBAL_ACTION_BACK : "recent".equals(name) ? GLOBAL_ACTION_RECENTS : -1;
                      if (action != -1) performGlobalAction(action);
                  });
              }
          
              private static float bound(float n) { return Math.max(0.0f, Math.min(1.0f, n)); }
          }
