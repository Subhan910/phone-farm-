                  public void onSurfaceTextureSizeChanged(SurfaceTexture st, int w, int hh) { }

                  @Override
                  public boolean onSurfaceTextureDestroyed(final SurfaceTexture st) {
                      final Surface s = surface;
                      surface = null;
                      if (s == null) return true;
                      dev.stopSurface(s, () -> {
                          try { s.release(); } catch (Throwable ignored) { }
                          try { st.release(); } catch (Throwable ignored) { }
                      });
                      return false;
                  }

                  @Override
                  public void onSurfaceTextureUpdated(SurfaceTexture st) { }

                  void onState() {
                      if (dev.state == FarmDevice.ST_LIVE) {
                          retries = 0;
                      } else if (dev.state == FarmDevice.ST_ERROR && active && retries < MAX_RETRY) {
                          retries++;
                          ui.removeCallbacks(retry);
                          ui.postDelayed(retry, 4000L * retries);
                      }
                      refresh();
                  }

                  void refresh() {
                      titleTv.setText(dev.label());
                      subTv.setText(dev.host + (dev.vw > 0 ? " · " + dev.vw + "×" + dev.vh : ""));
                      dotV.setBackground(dot(stateColor(dev.state)));
                      if (dev.vw > 0 && dev.vh > 0) screen.setRatio(dev.vw / (float) dev.vh);
                      syncChip.setText(sync ? "Sinkron: Hidup" : "Sinkron: Mati");
                      pillOn(syncChip, sync);
                      if (sync) {
                          int n = 0;
                          for (FarmDevice d : devs) if (d != dev && d.isLive()) n++;
                          banner.setVisibility(View.VISIBLE);
                          banner.setText("Sinkron aktif · gerakan ditiru ke " + n + " HP lain");
                      } else {
                          banner.setVisibility(View.GONE);
                      }
                      switch (dev.state) {
                          case FarmDevice.ST_LIVE:
                              status.setVisibility(View.GONE);
                              break;
                          case FarmDevice.ST_ERROR:
                              status.setVisibility(View.VISIBLE);
                              status.setTextColor(MainActivity.BAD);
                              status.setText(dev.message + "\n\n" + (retries < MAX_RETRY ? "Mencoba lagi otomatis..." : "Tutup lalu buka lagi untuk mencoba ulang"));
                              break;
                          default:
                              status.setVisibility(View.VISIBLE);
                              status.setTextColor(MainActivity.DIM);
                              status.setText(dev.state == FarmDevice.ST_CONNECTING ? dev.message : "Menunggu...");
                      }
                  }
              }

