              // ---------- berkas & jaringan dasar ----------
              private static byte[] readAll(InputStream in, int max, boolean strict) throws IOException {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[16384];
                  int n;
                  while ((n = in.read(buf)) != -1) {
                      if (bo.size() + n > max) {
                          if (strict) throw new IOException("File terlalu besar");
                          bo.write(buf, 0, max - bo.size());
                          break;
                      }
                      bo.write(buf, 0, n);
                  }
                  return bo.toByteArray();
              }

              private String readAsset(String path) throws IOException {
                  try (InputStream in = getAssets().open(path)) {
                      return new String(readAll(in, MAX_HTML, true), "UTF-8");
                  }
              }

              private static String readFile(File f) throws IOException {
                  try (InputStream in = new FileInputStream(f)) {
                      return new String(readAll(in, MAX_HTML, true), "UTF-8");
                  }
              }

              private static void writeFile(File f, String s) throws IOException {
                  try (FileOutputStream os = new FileOutputStream(f)) {
                      os.write(s.getBytes("UTF-8"));
                  }
              }

              private String fetchText(String url) throws IOException {
                  String u = url;
                  for (int i = 0; i < 5; i++) {
                      if (!(u.startsWith("http://") || u.startsWith("https://"))) throw new IOException("URL tidak valid");
                      HttpURLConnection c = (HttpURLConnection) new URL(u).openConnection();
                      try {
                          c.setConnectTimeout(8000);
                          c.setReadTimeout(15000);
                          c.setInstanceFollowRedirects(false);
                          c.setRequestProperty("User-Agent", "CFM-WebUI/" + APP_VER);
                          int code = c.getResponseCode();
                          if (code == 301 || code == 302 || code == 303 || code == 307 || code == 308) {
                              String loc = c.getHeaderField("Location");
                              if (loc == null) throw new IOException("Redirect tanpa Location");
                              u = new URL(new URL(u), loc).toString();
                              continue;
                          }
                          if (code != 200) throw new IOException("HTTP " + code);
                          try (InputStream in = c.getInputStream()) {
                              return new String(readAll(in, MAX_HTML, true), "UTF-8");
                          }
                      } finally {
                          c.disconnect();
                      }
                  }
                  throw new IOException("Terlalu banyak redirect");
              }

              private static String probe(String host, int port, int timeout) {
                  try (Socket k = new Socket()) {
                      k.connect(new InetSocketAddress(host, port), timeout);
                      return "open";
                  } catch (SocketTimeoutException e) {
                      return "timeout";
                  } catch (Exception e) {
                      String m = String.valueOf(e.getMessage());
                      return m.contains("refused") ? "refused" : "error: " + m;
                  }
              }

              // dipakai CFM.fetch(): HTTP dari sisi native (tanpa batasan CORS), hanya teks
              private static JSONObject httpFetch(String url, JSONObject o) throws Exception {
                  if (url == null || !(url.startsWith("http://") || url.startsWith("https://"))) throw new IOException("Hanya http/https");
                  if (o == null) o = new JSONObject();
                  String method = o.optString("method", "GET").toUpperCase(Locale.ROOT);
                  if (!method.matches("GET|POST|PUT|DELETE|HEAD|OPTIONS")) throw new IOException("Metode tidak didukung: " + method);
                  int timeout = Math.max(1000, Math.min(60000, o.optInt("timeout", 15000)));
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  try {
                      c.setConnectTimeout(timeout);
                      c.setReadTimeout(timeout);
                      c.setRequestMethod(method);
                      JSONObject h = o.optJSONObject("headers");
                      if (h != null) {
                          Iterator<String> it = h.keys();
                          while (it.hasNext()) {
                              String k = it.next();
                              c.setRequestProperty(k, h.optString(k));
                          }
                      }
                      if (o.has("body") && !method.equals("GET") && !method.equals("HEAD")) {
                          byte[] bytes = o.optString("body").getBytes("UTF-8");
                          c.setDoOutput(true);
                          c.setFixedLengthStreamingMode(bytes.length);
                          try (OutputStream os = c.getOutputStream()) { os.write(bytes); }
                      }
                      int code = c.getResponseCode();
                      InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                      String text = "";
                      if (in != null) {
                          try (InputStream is = in) { text = new String(readAll(is, 2 * 1024 * 1024, false), "UTF-8"); }
                      }
                      JSONObject r = new JSONObject();
                      r.put("status", code);
                      r.put("ok", code >= 200 && code < 300);
                      r.put("contentType", String.valueOf(c.getContentType()));
                      r.put("body", text);
                      return r;
                  } finally {
                      c.disconnect();
                  }
              }

              private static String lit(Object v) {
                  if (v == null || v == JSONObject.NULL) return "null";
                  if (v instanceof Boolean || v instanceof Number) return v.toString();
                  String s = (v instanceof JSONObject || v instanceof JSONArray) ? v.toString() : JSONObject.quote(v.toString());
                  return s.replace(String.valueOf((char) 0x2028), "\\u2028").replace(String.valueOf((char) 0x2029), "\\u2029");
              }

              // ---------- registri fitur ----------
              private static String attr(String tag, String n) {
                  Matcher m = Pattern.compile("(?<![\\w-])" + n + "\\s*=\\s*(?:\"([^\"]*)\"|'([^']*)')", Pattern.CASE_INSENSITIVE).matcher(tag);
                  if (!m.find()) return null;
                  return m.group(1) != null ? m.group(1) : m.group(2);
              }

              private static String slug(String s) {
                  String r = s.toLowerCase(Locale.ROOT).replaceAll("[^a-z0-9]+", "-").replaceAll("^-+|-+$", "");
                  if (r.length() > 32) r = r.substring(0, 32).replaceAll("-+$", "");
                  return r.isEmpty() ? "fitur" : r;
              }

              private static List<Integer> nums(String v) {
                  List<Integer> l = new ArrayList<>();
                  for (String x : v.split("[^0-9]+")) {
                      if (x.isEmpty()) continue;
                      try { l.add(Integer.parseInt(x.length() > 9 ? x.substring(0, 9) : x)); } catch (Exception ignored) { }
                  }
                  return l;
              }

              private static int cmpVer(String a, String b) {
                  List<Integer> x = nums(a), y = nums(b);
                  for (int i = 0; i < Math.max(x.size(), y.size()); i++) {
                      int u = i < x.size() ? x.get(i) : 0, v = i < y.size() ? y.get(i) : 0;
                      if (u != v) return u < v ? -1 : 1;
                  }
                  return 0;
              }

              private Plugin parse(String html, String fb) {
                  Plugin p = new Plugin();
                  String id = null;
                  Matcher m = TAG_META.matcher(html);
                  while (m.find()) {
                      String tag = m.group();
                      String n = attr(tag, "name");
                      if (n == null) continue;
                      n = n.trim().toLowerCase(Locale.ROOT);
                      if (!n.startsWith("cfm-")) continue;
                      String c = attr(tag, "content");
                      if (c == null) continue;
                      c = c.trim().replace("&amp;", "&").replace("&quot;", "\"");
                      if (n.equals("cfm-id")) id = c;
                      else if (n.equals("cfm-name")) p.name = c;
                      else if (n.equals("cfm-icon")) p.icon = c;
                      else if (n.equals("cfm-version")) { if (!c.isEmpty()) p.ver = c; }
                      else if (n.equals("cfm-update-url")) p.updateUrl = c;
                      else if (n.equals("cfm-order")) {
                          try { p.order = Integer.parseInt(c); } catch (Exception ignored) { }
                      }
                  }
                  String ttl = "";
                  Matcher t = Pattern.compile("<title[^>]*>([^<]*)</title>", Pattern.CASE_INSENSITIVE).matcher(html);
                  if (t.find()) ttl = t.group(1).trim();
                  String base = (id != null && !id.isEmpty()) ? id
                          : (fb != null && !fb.isEmpty()) ? fb
                          : !ttl.isEmpty() ? ttl : "fitur";
                  p.id = slug(base);
                  if (p.name.isEmpty()) p.name = !ttl.isEmpty() ? ttl : p.id;
                  if (p.icon.isEmpty()) p.icon = "\uD83E\uDDE9";
                  return p;
              }

