              private void loadBundledMeta() {
                  try {
                      String[] fs = getAssets().list("plugins");
                      if (fs == null) return;
                      for (String f : fs) {
                          if (!f.endsWith(".html")) continue;
                          try {
                              Plugin p = parse(readAsset("plugins/" + f), f.substring(0, f.length() - 5));
                              bundled.put(p.id, p);
                              bundledFile.put(p.id, "plugins/" + f);
                          } catch (Exception ignored) { }
                      }
                  } catch (Exception ignored) { }
              }

              private void writeInstall(String id, String html) throws IOException {
                  File f = new File(plugDir, id + ".html"), tmp = new File(plugDir, id + ".tmp"), bak = new File(plugDir, id + ".bak");
                  writeFile(tmp, html);
                  if (f.exists()) { bak.delete(); f.renameTo(bak); }
                  if (!tmp.renameTo(f)) throw new IOException("Gagal menyimpan fitur");
              }

              private void seedPlugins() {
                  for (String id : bundled.keySet()) {
                      if (removed.contains(id)) continue;
                      File f = new File(plugDir, id + ".html");
                      boolean put = !f.exists();
                      if (!put) {
                          try { put = cmpVer(bundled.get(id).ver, parse(readFile(f), id).ver) > 0; } catch (Exception e) { put = true; }
                      }
                      if (put) {
                          try { writeInstall(id, readAsset(bundledFile.get(id))); } catch (Exception ignored) { }
                      }
                  }
              }

              private void scanPlugins() {
                  plugins.clear();
                  File[] fs = plugDir.listFiles();
                  List<Plugin> l = new ArrayList<>();
                  if (fs != null) {
                      for (File f : fs) {
                          String n = f.getName();
                          if (!n.endsWith(".html")) continue;
                          String id = n.substring(0, n.length() - 5);
                          try {
                              Plugin p = parse(readFile(f), id);
                              p.id = id;
                              p.file = f;
                              l.add(p);
                          } catch (Exception ignored) { }
                      }
                  }
                  Collections.sort(l, (a, b2) -> a.order != b2.order ? Integer.compare(a.order, b2.order) : a.name.compareToIgnoreCase(b2.name));
                  for (Plugin p : l) plugins.put(p.id, p);
              }

              private String updateUrlOf(Plugin p) {
                  return !p.updateUrl.isEmpty() ? p.updateUrl : plugPrefs.getString("src_" + p.id, "");
              }

