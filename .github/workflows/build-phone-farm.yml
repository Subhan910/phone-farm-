          /**
           * Cangkang aplikasi. Fitur-fitur (Catatan, IP, Kalkulator, dst.) bukan lagi kode Java,
           * melainkan berkas HTML di folder fitur aplikasi. Pasang / ganti HTML = upgrade fitur,
