                      boolean ok = FarmAccessibilityService.global(b.optString("key", ""));
                      sendJson(socket, ok ? 200 : 503, new JSONObject().put("ok", ok).put("error", ok ? "" : "Aksesibilitas belum aktif atau tombol tidak didukung"));
