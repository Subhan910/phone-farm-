           */
          public class MainActivity extends Activity {

              private static final String APP_VER = "3.2";
              private static final String HOME_HOST = "192.168.43.1";
              private static final String HOME = "http://192.168.43.1/";
              private static final String NAS_HOME = "http://192.168.43.1:8088/";
