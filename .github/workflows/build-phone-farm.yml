                  if (snack == null) return;
                  snack.animate().alpha(0f).translationY(dp(16)).setDuration(180).withEndAction(() -> snack.setVisibility(View.GONE)).start();
              };
              private final Runnable statusTick = new Runnable() {
                  @Override
                  public void run() {
                      pollStatus();
                      ui.postDelayed(this, 9000);
                  }
              };

              // ---- fitur (plugin HTML) ----
              private static class Plugin {
                  String id = "", name = "", icon = "", ver = "1", updateUrl = "";
                  int order = 100;
                  File file;
              }

              private File plugDir;
              private final Map<String, Plugin> plugins = new LinkedHashMap<>();
              private final Map<String, Plugin> bundled = new HashMap<>();
