              private void fillTile(FrameLayout f, String key, int tint) {
                  f.removeAllViews();
                  int r = iconRes(key);
                  if (r != 0) {
                      ImageView v = icon(r, tint, 20);
                      f.addView(v, new FrameLayout.LayoutParams(dp(20), dp(20), Gravity.CENTER));
                  } else {
                      Plugin p = key.startsWith("p:") ? plugins.get(key.substring(2)) : null;
                      TextView t = text(p == null ? "🧩" : p.icon, 18, FG, false);
                      t.setGravity(Gravity.CENTER);
                      f.addView(t, new FrameLayout.LayoutParams(-2, -2, Gravity.CENTER));
                  }
              }

              private FrameLayout tileFor(String key, int radius, int bg, int tint) {
                  FrameLayout f = new FrameLayout(this);
                  f.setBackground(shape(bg, radius));
                  fillTile(f, key, tint);
                  return f;
              }

