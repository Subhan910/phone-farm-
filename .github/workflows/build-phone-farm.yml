              private View navItem(final String key) {
                  boolean act = key.equals(cur);
                  LinearLayout row = new LinearLayout(this);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(10), dp(8), dp(14), dp(8));
                  row.setBackground(rip(act ? 0x2A7AA7FF : 0x00000000, 14, 0));
                  row.addView(tileFor(key, 11, act ? 0x337AA7FF : CARD2, act ? ACC : DIM), new LinearLayout.LayoutParams(dp(38), dp(38)));
                  TextView n = text(nameOf(key), 15, act ? FG : 0xFFC9D1E0, act);
                  n.setSingleLine(true);
                  n.setEllipsize(TextUtils.TruncateAt.END);
                  LinearLayout.LayoutParams np = new LinearLayout.LayoutParams(0, -2, 1);
                  np.setMargins(dp(12), 0, 0, 0);
                  row.addView(n, np);
                  if (act) row.addView(dotView(ACC), new LinearLayout.LayoutParams(dp(7), dp(7)));
                  row.setOnClickListener(v -> { closeDrawer(); show(key); });
                  LinearLayout.LayoutParams rp = new LinearLayout.LayoutParams(-1, -2);
                  rp.setMargins(dp(10), dp(2), dp(10), dp(2));
                  row.setLayoutParams(rp);
                  return row;
              }

              private View dotView(int c) {
                  View v = new View(this);
                  v.setBackground(dotShape(c));
                  return v;
              }

              private void openDrawer() {
                  if (drawerOpen) return;
                  rebuildDrawer();
                  drawerOpen = true;
                  drawerLayer.setVisibility(View.VISIBLE);
                  scrim.setAlpha(0f);
                  scrim.animate().alpha(1f).setDuration(200).start();
                  drawer.setTranslationX(-drawerW);
                  drawer.animate().translationX(0f).setDuration(240).setInterpolator(new DecelerateInterpolator()).start();
                  pollStatus();
              }

              private void closeDrawer() {
                  if (!drawerOpen) return;
                  drawerOpen = false;
                  scrim.animate().alpha(0f).setDuration(180).start();
                  drawer.animate().translationX(-drawerW).setDuration(200)
                          .withEndAction(() -> { if (!drawerOpen) drawerLayer.setVisibility(View.GONE); }).start();
              }

