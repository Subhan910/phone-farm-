              private static Request readRequest(InputStream in) throws IOException {
                  ByteArrayOutputStream head = new ByteArrayOutputStream();
                  int state = 0, b;
                  while ((b = in.read()) != -1 && head.size() < 8192) {
                      head.write(b);
                      if (state == 0 && b == '\r') state = 1;
                      else if (state == 1 && b == '\n') state = 2;
                      else if (state == 2 && b == '\r') state = 3;
                      else if (state == 3 && b == '\n') { state = 4; break; }
                      else state = b == '\r' ? 1 : 0;
                  }
                  if (state != 4) return null;
                  String[] lines = new String(head.toByteArray(), StandardCharsets.ISO_8859_1).split("\r\n");
                  if (lines.length == 0) return null;
                  String[] first = lines[0].split(" ");
                  if (first.length < 2) return null;
                  Request r = new Request();
                  r.method = first[0].toUpperCase(Locale.ROOT);
                  r.target = first[1];
                  for (int i = 1; i < lines.length; i++) {
                      int k = lines[i].indexOf(':');
                      if (k > 0) r.headers.put(lines[i].substring(0, k).trim().toLowerCase(Locale.ROOT), lines[i].substring(k + 1).trim());
                  }
                  int len = 0;
                  try { len = Integer.parseInt(r.headers.get("content-length") == null ? "0" : r.headers.get("content-length")); }
                  catch (Exception ignored) { }
                  if (len < 0 || len > 65536) throw new IOException("Body terlalu besar");
                  byte[] body = new byte[len];
                  int off = 0;
                  while (off < len) {
                      int n = in.read(body, off, len - off);
                      if (n < 0) throw new IOException("Body tidak lengkap");
                      off += n;
                  }
                  r.body = new String(body, StandardCharsets.UTF_8);
                  return r;
              }
          
              private void handleClient(Socket socket) throws Exception {
