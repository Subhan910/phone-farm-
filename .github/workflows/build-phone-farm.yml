                      DisplayMetrics dm = new DisplayMetrics();
                      WindowManager wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                      Display d = wm.getDefaultDisplay();
                      d.getRealMetrics(dm);
                      screenWidth = Math.max(1, dm.widthPixels);
                      screenHeight = Math.max(1, dm.heightPixels);
                      screenDensity = dm.densityDpi;
                      imageReader = ImageReader.newInstance(screenWidth, screenHeight, PixelFormat.RGBA_8888, 2);
                      captureThread = new HandlerThread("CFM-Farm-Capture");
                      captureThread.start();
                      imageReader.setOnImageAvailableListener(reader -> captureLatest(reader), new Handler(captureThread.getLooper()));
                      virtualDisplay = projection.createVirtualDisplay("CFM Phone Farm", screenWidth, screenHeight,
                              screenDensity, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, imageReader.getSurface(), null, null);
                      final MediaProjection sessionProjection = projection;
                      sessionProjection.registerCallback(new MediaProjection.Callback() {
                          @Override public void onStop() {
                              if (projection != sessionProjection) return;
                              captureReady = false;
                              latestJpeg = null;
                              try { if (virtualDisplay != null) virtualDisplay.release(); } catch (Exception ignored) { }
                              virtualDisplay = null;
                              try { if (imageReader != null) imageReader.close(); } catch (Exception ignored) { }
                              imageReader = null;
                              HandlerThread ct = captureThread;
                              captureThread = null;
                              if (ct != null) ct.quitSafely();
                              projection = null;
                          }
                      }, new Handler(Looper.getMainLooper()));
