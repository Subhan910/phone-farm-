          <script>
          (function(){
            const $ = id => document.getElementById(id);
            let devices = [], selectedId = null, pollTimer = null, polling = false, scanning = false;
            const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const byId = id => devices.find(d => d.id === id);
            const setAgentStatus = (text, kind) => {
              $('agentState').textContent = text;
              $('agentDot').className = 'statusdot ' + (kind || '');
            };
            async function api(ip, token, path, method, body, timeout) {
              const opts = {method:method || 'GET', timeout:timeout || 5000, headers:{'Content-Type':'application/json'}};
              if (token) opts.headers.Authorization = 'Bearer ' + token;
              if (body != null) opts.body = JSON.stringify(body);
              const r = await CFM.fetch('http://' + ip + ':8765' + path, opts);
              let j = {};
              try { j = JSON.parse(r.body || '{}'); } catch(e) {}
              if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
              return j;
            }
            async function saveDevices(){ await CFM.set('farm_devices', JSON.stringify(devices)); }
            async function loadDevices(){
              try { const s = await CFM.get('farm_devices'); devices = s ? JSON.parse(s) : []; if (!Array.isArray(devices)) devices=[]; }
              catch(e){ devices=[]; }
              devices = devices.map((d,i)=>({id:String(d.id || ('dev-'+i)),name:String(d.name||''),ip:String(d.ip||''),token:String(d.token||''),online:!!d.online,battery:d.battery,model:d.model||''}));
              renderDevices();
              refreshAll();
            }
            function renderDevices(){
              if(!devices.length){$('devices').innerHTML='<div class="empty"><div class="big">📱</div><b>Belum ada perangkat</b>Tambahkan IP dan token, atau pindai jaringan lokal.</div>';return;}
              $('devices').innerHTML = devices.map(d=>{
                const online = d.online;
                const status = online ? ('Online' + (d.battery >= 0 ? ' · Baterai '+d.battery+'%' : '')) : 'Belum terhubung';
                return '<div class="device"><div class="tile">📱</div><div class="meta"><div class="name">'+esc(d.name||d.model||'HP '+d.ip)+'</div><div class="sub">'+esc(d.ip)+':8765 · '+esc(status)+'</div><div class="actions"><button class="btn sm pri" data-connect="'+esc(d.id)+'">Kontrol</button><button class="btn sm" data-token="'+esc(d.id)+'">Token</button><button class="btn sm ghost" data-check="'+esc(d.id)+'">Cek</button><button class="btn sm bad" data-remove="'+esc(d.id)+'">Hapus</button></div></div><span class="statusdot '+(online?'ok':'bad')+'"></span></div>';
              }).join('');
              $('devices').querySelectorAll('[data-connect]').forEach(b=>b.onclick=()=>connectDevice(b.dataset.connect));
              $('devices').querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>editToken(b.dataset.token));
              $('devices').querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>refreshDevice(b.dataset.check));
              $('devices').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeDevice(b.dataset.remove));
            }
            async function refreshAgent(){
              try{
                const info = await CFM.agentInfo();
                $('agentToken').textContent = info.token || '—';
                $('agentIps').textContent = Array.isArray(info.ips) && info.ips.length ? info.ips.join(' · ') : 'IP belum terdeteksi; pastikan Wi-Fi/hotspot aktif.';
                setAgentStatus(info.running ? 'Agent berjalan di port '+(info.port||8765) : 'Agent belum aktif', info.running?'ok':'bad');
                if(info.accessibility) $('agentState').textContent += ' · Aksesibilitas aktif';
                if(info.screenReady) $('agentState').textContent += ' · Layar siap';
              }catch(e){setAgentStatus('Tidak dapat membaca status agent','bad');}
            }
            async function refreshDevice(id){
              const d=byId(id); if(!d)return;
              try{
                const j=await api(d.ip,'','/api/status','GET',null,1800);
                d.online=true;d.model=j.name||'';d.battery=Number.isFinite(+j.battery)?+j.battery:-1;
                if(!d.name)d.name=j.name||('HP '+d.ip);
              }catch(e){d.online=false;d.battery=-1;}
              await saveDevices();renderDevices();
            }
            async function refreshAll(){
              await Promise.all(devices.map(d=>refreshDevice(d.id)));
            }
            async function addOne(ip, token, name){
              ip=String(ip||'').trim(); token=String(token||'').trim(); name=String(name||'').trim();
              if(!/^(?:\d{1,3}\.){3}\d{1,3}$/.test(ip)){throw new Error('Format IP tidak valid');}
              const octets=ip.split('.').map(Number); if(octets.some(n=>n<0||n>255))throw new Error('IP tidak valid');
              let d=devices.find(x=>x.ip===ip);
              if(d){d.token=token||d.token;if(name)d.name=name;}
              else {d={id:'d-'+Date.now()+'-'+Math.random().toString(16).slice(2,6),ip,token,name,online:false,battery:-1};devices.push(d);}
              await saveDevices();renderDevices();await refreshDevice(d.id);
            }
            $('addDevice').onclick=async()=>{
              try{await addOne($('devIp').value,$('devToken').value,$('devName').value);$('devIp').value='';$('devToken').value='';$('devName').value='';$('scanState').textContent='Perangkat disimpan.';}
              catch(e){alert(e.message||String(e));}
            };
            async function editToken(id){
              const d=byId(id);if(!d)return;
              const t=prompt('Masukkan token dari HP '+d.ip, d.token||'');
              if(t===null)return;d.token=t.trim();await saveDevices();renderDevices();
            }
            async function removeDevice(id){
              if(!confirm('Hapus perangkat ini dari daftar?'))return;
              devices=devices.filter(d=>d.id!==id);await saveDevices();renderDevices();
              if(selectedId===id)closeRemote();
            }
            $('refreshAll').onclick=refreshAll;
            $('agentStart').onclick=async()=>{try{await CFM.agentStart();setAgentStatus('Mengaktifkan agent…');setTimeout(refreshAgent,900);setTimeout(refreshAgent,2200);}catch(e){alert(e.message||String(e));}};
            $('agentCapture').onclick=async()=>{try{await CFM.agentCapture();setAgentStatus('Menunggu izin berbagi layar Android…');setTimeout(refreshAgent,1800);setTimeout(refreshAgent,3500);}catch(e){alert(e.message||String(e));}};
            $('agentAccess').onclick=async()=>{try{await CFM.agentAccessibility();}catch(e){alert(e.message||String(e));}};
            $('agentRefresh').onclick=refreshAgent;
            $('agentStop').onclick=async()=>{if(!confirm('Matikan agent di HP ini?'))return;try{await CFM.agentStop();setTimeout(refreshAgent,500);}catch(e){alert(e.message||String(e));}};
            $('copyToken').onclick=async()=>{try{await CFM.copy($('agentToken').textContent);$('agentState').textContent='Token disalin ke clipboard HP ini.';}catch(e){alert('Gagal menyalin token');}};
            $('scan').onclick=async()=>{
              if(scanning)return;
              const prefix=$('prefix').value.trim();
              if(!/^(?:\d{1,3}\.){2}\d{1,3}$/.test(prefix)){alert('Prefix harus seperti 192.168.43');return;}
              const parts=prefix.split('.').map(Number);if(parts.some(n=>n<0||n>255)){alert('Prefix IP tidak valid');return;}
              scanning=true;$('scan').disabled=true;$('scanState').textContent='Memindai…';let next=2,found=0,done=0;
              const worker=async()=>{
                while(next<=254){
                  const n=next++;const ip=prefix+'.'+n;
                  try{
                    const p=await CFM.checkPort(ip,8765,350);
                    if(p==='open'){
                      const j=await api(ip,'','/api/status','GET',null,1600);
                      let d=devices.find(x=>x.ip===ip);
                      if(!d){d={id:'d-'+Date.now()+'-'+n,ip,token:'',name:j.name||('HP '+ip),online:true,battery:+j.battery||-1,model:j.name||''};devices.push(d);}
                      else{d.online=true;d.model=j.name||'';d.battery=Number.isFinite(+j.battery)?+j.battery:-1;if(!d.name)d.name=j.name||'';}
                      found++;
                    }
                  }catch(e){}
                  done++;if(done%10===0||done===253)$('scanState').textContent='Memeriksa '+done+'/253 · ditemukan '+found;
                }
              };
              try{await Promise.all(Array.from({length:12},worker));await saveDevices();renderDevices();$('scanState').textContent='Selesai · '+found+' agent ditemukan. Isi token tiap HP untuk mengontrol.';}
              finally{scanning=false;$('scan').disabled=false;}
            };
            async function connectDevice(id){
              const d=byId(id);if(!d)return;
              if(!d.token){const t=prompt('Masukkan token yang tampil pada HP '+d.ip,'');if(!t)return;d.token=t.trim();await saveDevices();}
              selectedId=id;$('remote').classList.remove('hide');$('remoteName').textContent=d.name||d.model||d.ip;$('remoteInfo').textContent=d.ip+':8765';
              $('screen').removeAttribute('src');$('screenMessage').classList.remove('hide');$('screenMessage').textContent='Menghubungkan layar…';$('controlState').textContent='';
              startPolling();await refreshScreen();
              $('remote').scrollIntoView({behavior:'smooth',block:'start'});
            }
            function startPolling(){stopPolling();pollTimer=setInterval(refreshScreen,1500);}
            function stopPolling(){if(pollTimer){clearInterval(pollTimer);pollTimer=null;}polling=false;}
            function closeRemote(){stopPolling();selectedId=null;$('remote').classList.add('hide');}
            $('closeRemote').onclick=closeRemote;
            async function refreshScreen(){
              if(polling||!selectedId)return;
              const d=byId(selectedId);if(!d||!d.token)return;
              polling=true;
              try{
                const j=await api(d.ip,d.token,'/api/screen','GET',null,7000);
                if(j.jpeg){$('screen').src='data:image/jpeg;base64,'+j.jpeg;$('screenMessage').classList.add('hide');}
                else $('screenMessage').textContent='Belum ada gambar layar.';
              }catch(e){
                $('screenMessage').classList.remove('hide');
                $('screenMessage').textContent=e.message==='HTTP 503'?'Aktifkan izin berbagi layar pada HP farm.':e.message;
              }finally{polling=false;}
            }
            $('refreshScreen').onclick=refreshScreen;
            async function sendCommand(path, body){
              const d=byId(selectedId);if(!d)return;
              try{await api(d.ip,d.token,path,'POST',body,5000);$('controlState').textContent='Perintah dikirim.';}
              catch(e){$('controlState').textContent='Gagal: '+e.message;}
            }
            document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>sendCommand('/api/key',{key:b.dataset.key}));
            $('sendTextBtn').onclick=()=>{const v=$('sendText').value;if(!v)return;sendCommand('/api/text',{text:v});};
            let gesture=null;
            $('screen').addEventListener('pointerdown',e=>{
              if(!selectedId)return;e.preventDefault();const r=$('screen').getBoundingClientRect();
              gesture={x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height)),cx:e.clientX,cy:e.clientY};
              try{$('screen').setPointerCapture(e.pointerId);}catch(err){}
            });
            $('screen').addEventListener('pointerup',e=>{
              if(!gesture)return;const r=$('screen').getBoundingClientRect();
              const x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
              const g=gesture;gesture=null;
              const dist=Math.hypot(e.clientX-g.cx,e.clientY-g.cy);
              if(dist<12)sendCommand('/api/tap',{x:g.x,y:g.y});
              else sendCommand('/api/swipe',{x1:g.x,y1:g.y,x2:x,y2:y,duration:Math.max(120,Math.min(1200,Math.round(dist*1.8)))});
            });
            $('screen').addEventListener('pointercancel',()=>{gesture=null;});
            CFM.on('hide',stopPolling);
            CFM.on('show',()=>{refreshAgent();refreshAll();if(selectedId)startPolling();});
            loadDevices();refreshAgent();
          })();
          </script>
          </body>
          </html>
          EOF_FILE
