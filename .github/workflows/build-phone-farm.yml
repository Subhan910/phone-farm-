              // design tokens (selaras dengan assets/cfm-ui.css)
              private static final int BG = 0xFF0B0E14, SURF = 0xFF11151C, CARD = 0xFF171C26, CARD2 = 0xFF1E2431, LINE = 0xFF283041;
              private static final int FG = 0xFFE8ECF3, DIM = 0xFF8F9BB0, ACC = 0xFF7AA7FF, ACC2 = 0xFF3E6BF0;
              private static final int OK = 0xFF3DD68C, WARN = 0xFFF5B946, BAD = 0xFFFF6B6B;
              private static final int REQ_SAVE = 4242, REQ_FILE = 4243, REQ_IMPORT = 4244, REQ_CAPTURE = 4245;
