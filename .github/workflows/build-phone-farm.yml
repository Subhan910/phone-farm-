      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: webui-app
        run: gradle assembleDebug --no-daemon

      - name: Siapkan file APK
        run: cp webui-app/app/build/outputs/apk/debug/app-debug.apk CFM-Phone-Farm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CFM-Phone-Farm-apk
          path: CFM-Phone-Farm.apk

      - name: Rilis (unduh APK langsung dari tab Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "phone-farm-apk-${{ github.run_number }}"
          name: "CFM Phone Farm #${{ github.run_number }}"
          files: CFM-Phone-Farm.apk
