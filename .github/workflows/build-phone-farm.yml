              private View progressBar() {
                  FrameLayout f = new FrameLayout(this);
                  f.setBackgroundColor(LINE);
                  progBar = new View(this);
                  progBar.setBackgroundColor(ACC);
                  progBar.setPivotX(0f);
                  progBar.setScaleX(0f);
                  f.addView(progBar, new FrameLayout.LayoutParams(-1, -1));
                  return f;
              }

              private void resetLoadBar() {
                  if (progBar == null) return;
                  progBar.animate().cancel();
                  progBar.setScaleX(0f);
                  progBar.setAlpha(1f);
              }

              private void setLoadBar(int p) {
                  if (progBar == null) return;
                  progBar.animate().cancel();
                  if (p >= 100) {
                      progBar.setAlpha(1f);
                      progBar.setScaleX(1f);
                      progBar.animate().alpha(0f).setStartDelay(250).setDuration(250)
                              .withEndAction(() -> { progBar.setScaleX(0f); progBar.setAlpha(1f); }).start();
                  } else {
                      progBar.setAlpha(1f);
                      progBar.animate().scaleX(Math.max(0.08f, p / 100f)).setStartDelay(0).setDuration(200).start();
                  }
              }

              private boolean isCurrent(WebView v) {
                  if (cur == null) return false;
                  if (cur.equals("webui")) return v == web;
                  if (cur.equals("nas")) return v == nas;
                  if (cur.startsWith("p:")) return v == pluginViews.get(cur.substring(2));
                  return false;
              }

              private void setServer(int st) {
                  srv = st;
                  int c = st == 1 ? OK : st == 2 ? BAD : DIM;
                  String s = st == 1 ? "Online" : st == 2 ? "Offline" : "Memeriksa";
                  if (chipDot != null) chipDot.setBackground(dotShape(c));
                  if (chipTxt != null) { chipTxt.setText(s); chipTxt.setTextColor(st == 0 ? DIM : c); }
                  if (srvDot != null) srvDot.setBackground(dotShape(c));
                  if (srvTxt != null) {
                      srvTxt.setText(st == 1 ? "Server CFM aktif" : st == 2 ? "Server tidak terjangkau" : "Memeriksa server...");
                  }
              }

              private void pollStatus() {
                  new Thread(() -> {
                      final String r = probe(HOME_HOST, 80, 1500);
                      runOnUiThread(() -> setServer("open".equals(r) ? 1 : 2));
                  }).start();
              }

