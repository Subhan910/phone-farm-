              private void pluginActions(final Plugin p) {
                  final List<String> ls = new ArrayList<>();
                  final List<Runnable> acts = new ArrayList<>();
                  ls.add("Buka");
                  acts.add(() -> show("p:" + p.id));
                  if (!updateUrlOf(p).isEmpty()) {
                      ls.add("Periksa pembaruan");
                      acts.add(() -> checkUpdates(Collections.singletonList(p)));
                  }
                  if (new File(plugDir, p.id + ".bak").exists()) {
                      ls.add("Kembalikan versi sebelumnya");
                      acts.add(() -> rollback(p));
                  }
                  if (bundled.containsKey(p.id)) {
                      ls.add("Atur ulang ke versi bawaan");
                      acts.add(() -> resetBundled(p));
                  }
                  if (lastErr.containsKey(p.id)) {
                      ls.add("Lihat error terakhir");
                      acts.add(() -> new Dlg(this).setTitle(p.name).setMessage(lastErr.get(p.id)).setPositiveButton("OK", null).show());
                  }
                  ls.add("Hapus");
                  acts.add(() -> new Dlg(this).setMessage("Hapus fitur \"" + p.name + "\"?")
                          .setPositiveButton("Hapus", (d, w) -> deletePlugin(p))
                          .setNegativeButton("Batal", null).show());
                  new Dlg(this).setTitle((p.icon + " " + p.name).trim())
                          .setItems(ls.toArray(new String[0]), (d, i) -> acts.get(i).run()).show();
              }

              private void deletePlugin(Plugin p) {
                  dropView(p.id);
                  p.file.delete();
                  new File(plugDir, p.id + ".bak").delete();
                  plugPrefs.edit().remove("src_" + p.id).apply();
                  if (bundled.containsKey(p.id)) { removed.add(p.id); saveRemoved(); }
                  scanPlugins();
                  refreshManager();
                  toast("Fitur dihapus");
              }

              private void rollback(Plugin p) {
                  File f = new File(plugDir, p.id + ".html"), bak = new File(plugDir, p.id + ".bak"), tmp = new File(plugDir, p.id + ".tmp");
                  if (!bak.exists()) return;
                  f.renameTo(tmp);
                  bak.renameTo(f);
                  tmp.renameTo(bak);
                  dropView(p.id);
                  scanPlugins();
                  refreshManager();
                  toast("Versi sebelumnya dikembalikan");
              }

              private void resetBundled(Plugin p) {
                  try {
                      writeInstall(p.id, readAsset(bundledFile.get(p.id)));
                      removed.remove(p.id);
                      saveRemoved();
                      dropView(p.id);
                      scanPlugins();
                      refreshManager();
                      toast("Dikembalikan ke versi bawaan");
                  } catch (Exception e) {
                      toast("Gagal: " + e.getMessage());
                  }
              }

              private void restoreBundled() {
                  int n = 0;
                  removed.clear();
                  saveRemoved();
                  for (String id : bundled.keySet()) {
                      if (new File(plugDir, id + ".html").exists()) continue;
                      try { writeInstall(id, readAsset(bundledFile.get(id))); n++; } catch (Exception ignored) { }
                  }
                  scanPlugins();
                  refreshManager();
                  toast(n + " fitur bawaan dipulihkan");
              }

              private void copyGuide() {
                  try {
                      copyText(readAsset("PLUGIN_GUIDE.md"));
                      toast("Panduan disalin. Tempel ke AI untuk membuat fitur baru.");
                  } catch (Exception e) {
                      toast("Panduan tidak ditemukan");
                  }
              }

              private void pickHtml() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT)
                          .addCategory(Intent.CATEGORY_OPENABLE)
                          .setType("*/*")
                          .putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  try {
                      startActivityForResult(i, REQ_IMPORT);
                  } catch (Exception e) {
                      toast("Tidak ada aplikasi pemilih file");
                  }
              }

              private void pasteHtml() {
                  String t = pasteText();
                  if (t.trim().isEmpty()) { toast("Clipboard kosong"); return; }
                  enqueue(null, t, "");
              }

              private void urlDialog() {
                  final EditText e = edit("https://.../fitur.html");
                  e.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  LinearLayout l = new LinearLayout(this);
                  l.setPadding(dp(20), dp(12), dp(20), 0);
                  l.addView(e, new LinearLayout.LayoutParams(-1, -2));
                  new Dlg(this).setTitle("Unduh fitur dari URL").setView(l)
                          .setPositiveButton("Unduh", (d, w) -> downloadPlugin(e.getText().toString().trim()))
                          .setNegativeButton("Batal", null).show();
              }

              private void downloadPlugin(final String url) {
                  if (!(url.startsWith("http://") || url.startsWith("https://"))) { toast("URL harus diawali http:// atau https://"); return; }
                  toast("Mengunduh...");
                  new Thread(() -> {
                      try {
                          final String html = fetchText(url);
                          String last = Uri.parse(url).getLastPathSegment();
                          final String fb = last == null ? null : last.replaceAll("(?i)\\.html?$", "");
                          runOnUiThread(() -> enqueue(fb, html, url));
                      } catch (Exception ex) {
                          final String m = String.valueOf(ex.getMessage());
                          runOnUiThread(() -> toastL("Gagal mengunduh: " + m));
                      }
                  }).start();
              }

              // antrean pemasangan: tiap berkas dikonfirmasi satu per satu
              private void enqueue(String fb, String html, String src) {
                  installQ.add(new String[]{fb == null ? "" : fb, html, src == null ? "" : src});
                  if (!installing) nextInstall();
              }

              private void nextInstall() {
                  String[] it = installQ.poll();
                  if (it == null) { installing = false; return; }
                  installing = true;
                  final String html = it[1], src = it[2];
                  if (html.trim().isEmpty() || html.indexOf('<') < 0) {
                      toast("Bukan berkas HTML" + (it[0].isEmpty() ? "" : ": " + it[0]));
                      nextInstall();
                      return;
                  }
                  final Plugin np = parse(html, it[0].isEmpty() ? null : it[0]);
                  Plugin old = plugins.get(np.id);
                  String head;
                  if (old == null) {
                      head = "Pasang fitur baru?\n\n" + np.icon + " " + np.name + "  (v" + np.ver + ")";
                  } else {
                      int c = cmpVer(np.ver, old.ver);
                      head = (c > 0 ? "Perbarui fitur?" : c == 0 ? "Versi sama. Timpa fitur ini?" : "Versi LEBIH LAMA. Turunkan versi?")
                              + "\n\n" + np.name + ":  v" + old.ver + "  \u2192  v" + np.ver;
                  }
                  new Dlg(this)
                          .setTitle("Pasang fitur")
                          .setMessage(head + "\n\nID: " + np.id
                                  + "\n\nFitur HTML berjalan dengan akses clipboard, penyimpanan, dan jaringan. Pasang hanya dari sumber yang kamu percaya.")
                          .setPositiveButton("Pasang", (d, w) -> {
                              try {
                                  installNow(np.id, html, src);
                                  toast("Terpasang: " + np.name);
                              } catch (Exception e) {
                                  toast("Gagal memasang: " + e.getMessage());
                              }
                              nextInstall();
                          })
                          .setNegativeButton("Batal", (d, w) -> nextInstall())
                          .setOnCancelListener(d -> nextInstall())
                          .show();
              }

              private void installNow(String id, String html, String src) throws IOException {
                  boolean was = ("p:" + id).equals(cur);
                  writeInstall(id, html);
                  removed.remove(id);
                  saveRemoved();
                  if (src != null && !src.isEmpty()) plugPrefs.edit().putString("src_" + id, src).apply();
                  dropView(id);
                  scanPlugins();
                  refreshManager();
                  if (was) show("p:" + id);
              }

              // cek pembaruan lewat cfm-update-url (atau URL asal pemasangan)
              private void checkUpdates(final List<Plugin> targets) {
                  final List<Plugin> t = new ArrayList<>();
                  for (Plugin p : targets) if (!updateUrlOf(p).isEmpty()) t.add(p);
                  if (t.isEmpty()) {
                      toast("Belum ada fitur dengan alamat pembaruan (cfm-update-url)");
                      return;
                  }
                  toast("Memeriksa pembaruan...");
                  new Thread(() -> {
                      final List<String[]> ups = new ArrayList<>();
                      int fail = 0;
                      for (Plugin p : t) {
                          String url = updateUrlOf(p);
                          try {
                              String html = fetchText(url);
                              Plugin np = parse(html, p.id);
                              if (!np.id.equals(p.id)) { fail++; continue; }
                              if (cmpVer(np.ver, p.ver) > 0) {
                                  ups.add(new String[]{p.id, html, url, p.name + "  v" + p.ver + " \u2192 v" + np.ver});
                              }
                          } catch (Exception e) {
                              fail++;
                          }
                      }
                      final int f = fail;
                      runOnUiThread(() -> showUpdates(ups, f));
                  }).start();
              }

              private void showUpdates(final List<String[]> ups, int fail) {
                  if (ups.isEmpty()) {
                      toast(fail > 0 ? "Tidak ada pembaruan (" + fail + " gagal dicek)" : "Semua fitur sudah versi terbaru");
                      return;
                  }
                  StringBuilder sb = new StringBuilder();
                  for (String[] u : ups) sb.append("\u2022 ").append(u[3]).append('\n');
                  new Dlg(this)
                          .setTitle("Pembaruan tersedia")
                          .setMessage(sb.toString().trim() + "\n\nFitur HTML berjalan dengan akses clipboard, penyimpanan, dan jaringan. Lanjutkan hanya jika sumbernya kamu percaya.")
                          .setPositiveButton("Pasang semua", (d, w) -> {
                              int n = 0;
                              for (String[] u : ups) {
                                  try { installNow(u[0], u[1], u[2]); n++; } catch (Exception ignored) { }
                              }
                              toast(n + " fitur diperbarui");
                          })
                          .setNegativeButton("Nanti", null).show();
              }

              // ---------- NAS HP (WebDAV) ----------
              private View buildNas() {
                  nas = new WebView(this);
                  nas.setBackgroundColor(BG);
                  WebSettings s = nas.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  nas.addJavascriptInterface(new NasBridge(), "NasApp");
                  nas.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedHttpAuthRequest(WebView v, HttpAuthHandler h, String host, String realm) {
                          String u = nasPrefs.getString("u", ""), p = nasPrefs.getString("p", "");
                          if (!nasTried && !u.isEmpty() && !p.isEmpty()) {
                              nasTried = true;
                              h.proceed(u, p);
                          } else {
                              askNasLogin(h);
                          }
                      }

                      @Override
                      public void onPageFinished(WebView v, String url) {
                          nasTried = false;
                      }

                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) showNasError(v);
                      }

                      @SuppressWarnings("deprecation")
                      @Override
                      public void onReceivedError(WebView v, int code, String desc, String failingUrl) {
                          if (Build.VERSION.SDK_INT < 23 && NAS_HOME.equals(failingUrl)) showNasError(v);
                      }
                  });
                  nas.setWebChromeClient(chrome);
                  nas.setDownloadListener((url, ua, cd, mime, len) -> {
                      if (Build.VERSION.SDK_INT >= 23 && Build.VERSION.SDK_INT < 29
                              && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, 7);
                          toastL("Izinkan akses penyimpanan, lalu ulangi unduhan");
                          return;
                      }
                      try {
                          Uri target = Uri.parse(url);
                          String name = target.getLastPathSegment();
                          if (name == null || name.isEmpty()) name = "unduhan";
                          String cred = nasPrefs.getString("u", "") + ":" + nasPrefs.getString("p", "");
                          DownloadManager.Request req = new DownloadManager.Request(target);
                          req.addRequestHeader("Authorization", "Basic " + Base64.encodeToString(cred.getBytes("UTF-8"), Base64.NO_WRAP));
                          req.setTitle(name);
                          req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                          ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(req);
                          toast("Mengunduh: " + name);
                      } catch (Exception e) {
                          toastL("Gagal mengunduh: " + e.getMessage());
                      }
                  });
                  return nas;
              }

              private void askNasLogin(final HttpAuthHandler h) {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(dp(20), dp(12), dp(20), 0);
                  final EditText u = edit("Pengguna");
                  u.setText(nasPrefs.getString("u", "admin"));
                  final EditText p = edit("Kata sandi");
                  p.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.setMargins(0, dp(4), 0, dp(4));
                  l.addView(u, lp);
                  l.addView(p, lp);
                  new Dlg(this)
                          .setTitle("Login NAS HP")
                          .setView(l)
                          .setPositiveButton("Masuk", (d, w) -> {
                              String us = u.getText().toString(), pw = p.getText().toString();
                              nasPrefs.edit().putString("u", us).putString("p", pw).apply();
                              nasTried = true;
                              h.proceed(us, pw);
                          })
                          .setNegativeButton("Batal", (d, w) -> h.cancel())
                          .setOnCancelListener(d -> h.cancel())
                          .show();
              }

              private void showNasError(WebView v) {
                  String html = errorPage("NAS tidak terjangkau", "Penyimpanan WebDAV di HP server belum bisa dijangkau.",
                          new String[]{"HP ini terhubung ke hotspot HP server", "Modul CFM WebDAV sedang aktif", "Port 8088 tidak diblokir"}, NAS_HOME);
                  v.loadDataWithBaseURL(NAS_HOME, html, "text/html", "UTF-8", null);
              }

              // ---------- layar penuh & pemutar eksternal ----------
              private void hideFull() {
                  if (customView == null) return;
                  FrameLayout decor = (FrameLayout) getWindow().getDecorView();
                  decor.removeView(customView);
                  decor.setSystemUiVisibility(savedUi);
                  customView = null;
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                  WebChromeClient.CustomViewCallback c = customCb;
                  customCb = null;
                  if (c != null) c.onCustomViewHidden();
              }

              private class NasBridge {
                  @JavascriptInterface
                  public void setLandscape(final boolean landscape) {
                      runOnUiThread(() -> setRequestedOrientation(landscape
                              ? ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                              : ActivityInfo.SCREEN_ORIENTATION_SENSOR));
                  }

                  @JavascriptInterface
                  public void openExternal(final String path, final String mime) {
                      runOnUiThread(() -> {
                          try {
                              if (path == null || !path.startsWith("/dav/")) return;
                              String u = nasPrefs.getString("u", ""), p = nasPrefs.getString("p", "");
                              String auth = u.isEmpty() ? "" : Uri.encode(u) + ":" + Uri.encode(p) + "@";
                              String base = NAS_HOME.substring(0, NAS_HOME.length() - 1).replace("http://", "http://" + auth);
                              Intent i = new Intent(Intent.ACTION_VIEW)
                                      .setDataAndType(Uri.parse(base + path), (mime == null || mime.isEmpty()) ? "video/*" : mime);
                              startActivity(Intent.createChooser(i, "Putar dengan"));
                          } catch (Exception e) {
                              toastL("Tidak ada aplikasi pemutar");
                          }
                      });
                  }
              }

              // ---------- pemantau jaringan (log untuk fitur IP & Jaringan) ----------
              private String type(Network n) {
                  NetworkCapabilities c = cm.getNetworkCapabilities(n);
                  if (c == null) return "?";
                  if (c.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR)) return "MOBILE";
                  if (c.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) return "WIFI";
                  if (c.hasTransport(NetworkCapabilities.TRANSPORT_VPN)) return "VPN";
                  if (c.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET)) return "ETHERNET";
                  return "OTHER";
              }

              private String snap() {
                  StringBuilder sb = new StringBuilder();
                  try {
                      for (NetworkInterface ni : Collections.list(NetworkInterface.getNetworkInterfaces())) {
                          if (!ni.isUp()) continue;
                          StringBuilder a = new StringBuilder();
                          for (InetAddress ia : Collections.list(ni.getInetAddresses())) {
                              if (ia.isLinkLocalAddress() || ia.isLoopbackAddress()) continue;
                              String h = ia.getHostAddress();
                              int p = h.indexOf('%');
                              if (p > 0) h = h.substring(0, p);
                              a.append(a.length() > 0 ? ", " : "").append(h);
                          }
                          if (a.length() > 0) sb.append(ni.getName()).append(": ").append(a).append('\n');
                      }
                  } catch (Exception e) {
                      sb.append(e);
                  }
                  return sb.length() == 0 ? "(tidak ada jaringan aktif)" : sb.toString();
              }

              private void log(final String s) {
                  final String line = "[" + new SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(new Date()) + "] " + s + "\n";
                  runOnUiThread(() -> {
                      logSb.insert(0, line);
                      if (logSb.length() > 20000) logSb.setLength(20000);
                      logSnap = logSb.toString();
                      for (WebView v : pluginViews.values()) dispatch(v, "net");
                  });
              }

              private void startNetMonitor() {
                  try {
                      cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                      cb = new ConnectivityManager.NetworkCallback() {
                          @Override
                          public void onLinkPropertiesChanged(Network n, LinkProperties lp) {
                              StringBuilder a = new StringBuilder(), d = new StringBuilder();
                              for (LinkAddress la : lp.getLinkAddresses()) {
                                  InetAddress ia = la.getAddress();
                                  if (ia instanceof Inet4Address) a.append(a.length() > 0 ? ", " : "").append(ia.getHostAddress());
                              }
                              for (InetAddress ia : lp.getDnsServers()) d.append(d.length() > 0 ? ", " : "").append(ia.getHostAddress());
                              String name = lp.getInterfaceName() + " (" + type(n) + ")";
                              names.put(n, name);
                              log("Network up " + name + ", address: " + a + ", dns: " + d);
                          }

                          @Override
                          public void onLost(Network n) {
                              log("Network down " + names.remove(n));
                          }
                      };
                      cm.registerNetworkCallback(new NetworkRequest.Builder().build(), cb);
                  } catch (Exception e) {
                      logSnap = "Gagal memantau jaringan: " + e + "\n";
                  }
              }

              // ---------- siklus hidup ----------
              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
                  ui.removeCallbacks(statusTick);
                  ui.post(statusTick);
                  nas.onResume();
                  for (WebView v : pluginViews.values()) v.onResume();
              }

              @Override
              protected void onPause() {
                  ui.removeCallbacks(statusTick);
                  web.onPause();
                  nas.onPause();
                  for (WebView v : pluginViews.values()) v.onPause();
                  super.onPause();
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) { hideFull(); return; }
                  if (drawerOpen) { closeDrawer(); return; }
                  if ("webui".equals(cur)) {
                      if (web.canGoBack()) web.goBack(); else super.onBackPressed();
                      return;
                  }
                  if ("nas".equals(cur) && nas.canGoBack()) { nas.goBack(); return; }
                  if (cur != null && cur.startsWith("p:")) {
                      WebView v = pluginViews.get(cur.substring(2));
                      if (v != null) {
                          v.evaluateJavascript(BACK_JS, r -> { if (!"true".equals(r)) show("webui"); });
                          return;
                      }
                  }
                  show("webui");
              }

              @Override
              protected void onDestroy() {
                  try { if (cm != null && cb != null) cm.unregisterNetworkCallback(cb); } catch (Exception ignored) { }
                  ui.removeCallbacksAndMessages(null);
                  web.destroy();
                  nas.destroy();
                  for (WebView v : new ArrayList<>(pluginViews.values())) v.destroy();
                  pluginViews.clear();
                  super.onDestroy();
              }
          }
