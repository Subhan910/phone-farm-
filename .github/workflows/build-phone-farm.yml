              private void captureLatest(ImageReader reader) {
                  long now = System.currentTimeMillis();
                  if (now - lastFrameAt < 700) {
                      Image skip = reader.acquireLatestImage();
                      if (skip != null) skip.close();
                      return;
                  }
                  Image image = null;
                  Bitmap padded = null, raw = null, scaled = null;
                  try {
                      image = reader.acquireLatestImage();
                      if (image == null) return;
                      lastFrameAt = now;
                      Image.Plane[] planes = image.getPlanes();
                      if (planes == null || planes.length == 0) return;
                      java.nio.ByteBuffer buffer = planes[0].getBuffer();
                      int pixelStride = planes[0].getPixelStride();
                      int rowStride = planes[0].getRowStride();
                      int rowPadding = Math.max(0, rowStride - pixelStride * screenWidth);
                      int paddedWidth = screenWidth + rowPadding / Math.max(1, pixelStride);
                      padded = Bitmap.createBitmap(paddedWidth, screenHeight, Bitmap.Config.ARGB_8888);
                      buffer.rewind();
                      padded.copyPixelsFromBuffer(buffer);
                      raw = Bitmap.createBitmap(padded, 0, 0, screenWidth, screenHeight);
                      int outW = Math.min(540, screenWidth);
                      int outH = Math.max(1, Math.round(screenHeight * (outW / (float) screenWidth)));
                      scaled = Bitmap.createScaledBitmap(raw, outW, outH, true);
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      scaled.compress(Bitmap.CompressFormat.JPEG, 42, out);
                      latestJpeg = out.toByteArray();
                  } catch (Exception ignored) {
                  } finally {
                      if (image != null) image.close();
                      if (scaled != null && scaled != raw) scaled.recycle();
                      if (raw != null && raw != padded) raw.recycle();
                      if (padded != null) padded.recycle();
                  }
              }
          
              private void stopCapture() {
                  captureReady = false;
                  latestJpeg = null;
                  try { if (virtualDisplay != null) virtualDisplay.release(); } catch (Exception ignored) { }
                  virtualDisplay = null;
                  try { if (imageReader != null) imageReader.close(); } catch (Exception ignored) { }
                  imageReader = null;
                  HandlerThread ct = captureThread;
                  captureThread = null;
                  if (ct != null) ct.quitSafely();
                  MediaProjection old = projection;
                  projection = null;
                  try { if (old != null) old.stop(); } catch (Exception ignored) { }
              }
          
              public static JSONObject info(Context ctx) {
                  JSONObject o = new JSONObject();
                  try {
                      o.put("running", running);
                      o.put("token", tokenFor(ctx));
                      o.put("id", deviceIdFor(ctx));
                      o.put("ips", localIps());
                      o.put("screenReady", latestJpeg != null && latestJpeg.length > 0);
                      o.put("accessibility", FarmAccessibilityService.isConnected());
                      o.put("port", PORT);
                  } catch (Exception ignored) { }
                  return o;
              }
          
              private static String tokenFor(Context ctx) {
                  SharedPreferences p = ctx.getSharedPreferences("farm_agent", MODE_PRIVATE);
                  String token = p.getString("token", "");
                  if (token.isEmpty()) {
                      byte[] b = new byte[8];
                      new SecureRandom().nextBytes(b);
                      StringBuilder s = new StringBuilder();
                      for (byte x : b) s.append(String.format(Locale.US, "%02x", x & 0xff));
                      token = s.toString();
                      p.edit().putString("token", token).apply();
                  }
                  return token;
              }
          
              private static String deviceIdFor(Context ctx) {
                  SharedPreferences p = ctx.getSharedPreferences("farm_agent", MODE_PRIVATE);
                  String id = p.getString("id", "");
                  if (id.isEmpty()) {
                      id = UUID.randomUUID().toString();
                      p.edit().putString("id", id).apply();
                  }
                  return id;
              }
          
              private static org.json.JSONArray localIps() {
                  org.json.JSONArray arr = new org.json.JSONArray();
                  try {
                      Enumeration<NetworkInterface> it = NetworkInterface.getNetworkInterfaces();
                      while (it != null && it.hasMoreElements()) {
                          NetworkInterface ni = it.nextElement();
                          if (!ni.isUp() || ni.isLoopback()) continue;
                          Enumeration<InetAddress> ads = ni.getInetAddresses();
                          while (ads.hasMoreElements()) {
                              InetAddress a = ads.nextElement();
                              if (a instanceof Inet4Address && !a.isLoopbackAddress() && !a.isLinkLocalAddress()) arr.put(a.getHostAddress());
                          }
                      }
                  } catch (Exception ignored) { }
                  return arr;
              }
          
              @Override public void onDestroy() {
                  stopping = true;
                  running = false;
                  try { if (serverSocket != null) serverSocket.close(); } catch (Exception ignored) { }
                  stopCapture();
                  if (active == this) active = null;
                  stopForeground(true);
                  super.onDestroy();
              }
          
              @Override public IBinder onBind(Intent intent) { return null; }
          }
