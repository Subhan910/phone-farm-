              // ---- UI ----
              private final Handler ui = new Handler(Looper.getMainLooper());
              private FrameLayout shell, topTile, drawerLayer;
              private LinearLayout drawer;
              private View scrim, progBar, chipDot, srvDot;
              private TextView subtitle, chipTxt, srvTxt, snack;
              private boolean drawerOpen;
