          cat > app/src/main/java/id/cfm/webui/FarmAccessibilityService.java <<'EOF_FILE'
          package id.cfm.webui;
          
          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          
          public class FarmAccessibilityService extends AccessibilityService {
              public static volatile FarmAccessibilityService instance;
          
              @Override protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }
          
              @Override public void onAccessibilityEvent(AccessibilityEvent event) { }
          
              @Override public void onInterrupt() {
                  if (instance == this) instance = null;
              }
          
              @Override public void onDestroy() {
                  if (instance == this) instance = null;
                  super.onDestroy();
              }
          
              public static boolean isConnected() {
                  return instance != null;
              }
          
              public static boolean tap(float nx, float ny) {
                  return gesture(nx, ny, nx, ny, 80);
              }
          
              public static boolean swipe(float x1, float y1, float x2, float y2, long duration) {
                  return gesture(x1, y1, x2, y2, Math.max(100, Math.min(2000, duration)));
              }
          
              private static boolean gesture(float x1, float y1, float x2, float y2, long duration) {
                  FarmAccessibilityService s = instance;
                  if (s == null || Build.VERSION.SDK_INT < 24) return false;
                  x1 = clamp(x1); y1 = clamp(y1); x2 = clamp(x2); y2 = clamp(y2);
                  android.util.DisplayMetrics dm = new android.util.DisplayMetrics();
                  android.view.WindowManager wm = (android.view.WindowManager) s.getSystemService(WINDOW_SERVICE);
                  if (wm == null) return false;
                  wm.getDefaultDisplay().getRealMetrics(dm);
                  Path path = new Path();
                  path.moveTo(x1 * Math.max(1, dm.widthPixels - 1), y1 * Math.max(1, dm.heightPixels - 1));
                  path.lineTo(x2 * Math.max(1, dm.widthPixels - 1), y2 * Math.max(1, dm.heightPixels - 1));
                  GestureDescription.StrokeDescription stroke = new GestureDescription.StrokeDescription(path, 0, duration);
                  GestureDescription.Builder builder = new GestureDescription.Builder();
                  builder.addStroke(stroke);
                  return s.dispatchGesture(builder.build(), null, null);
              }
          
              public static boolean global(String key) {
                  FarmAccessibilityService s = instance;
                  if (s == null) return false;
                  if ("back".equalsIgnoreCase(key)) return s.performGlobalAction(GLOBAL_ACTION_BACK);
                  if ("home".equalsIgnoreCase(key)) return s.performGlobalAction(GLOBAL_ACTION_HOME);
                  if ("recents".equalsIgnoreCase(key)) return s.performGlobalAction(GLOBAL_ACTION_RECENTS);
                  if ("notifications".equalsIgnoreCase(key)) return s.performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS);
                  return false;
              }
          
              public static boolean typeText(String text) {
                  FarmAccessibilityService s = instance;
                  if (s == null || text == null) return false;
                  AccessibilityNodeInfo root = s.getRootInActiveWindow();
                  if (root == null) return false;
                  AccessibilityNodeInfo node = null;
                  try {
                      node = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
                      if (node == null || !node.isEditable()) {
                          if (node != null) node.recycle();
                          node = findEditable(root);
                      }
                      if (node == null) return false;
                      Bundle args = new Bundle();
                      args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text);
                      return node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
                  } catch (Exception e) {
                      return false;
                  } finally {
                      if (node != null) node.recycle();
                      root.recycle();
                  }
              }
          
              private static AccessibilityNodeInfo findEditable(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  if (node.isEditable() && node.isEnabled()) return AccessibilityNodeInfo.obtain(node);
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo child = node.getChild(i);
                      if (child == null) continue;
                      AccessibilityNodeInfo found = findEditable(child);
                      child.recycle();
                      if (found != null) return found;
                  }
                  return null;
              }
          
              private static float clamp(float v) {
                  if (Float.isNaN(v) || v < 0f) return 0f;
                  if (v > 1f) return 1f;
                  return v;
              }
          }
